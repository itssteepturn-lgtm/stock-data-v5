</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V11 干净版-AMOUNT/VOL双源</title><style>

<div id="app">

<script>
function secid(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688'||c==='000300'||c==='000905') return '1.'+c; if(c.startsWith('60')||c.startsWith('68')) return '1.'+c; return '0.'+c; }
function tencentPrefix(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688') return 'sh'; if(c.startsWith('60')||c.startsWith('68')) return 'sh'; return 'sz'; }
let watch=JSON.parse(localStorage.getItem('v5_watch')||'["300313","600519"]');
function ensureWatch(){
  const w=document.getElementById('watch'); w.innerHTML='';
  watch.forEach(code=>{
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<div style="font-weight:700">${code}</div><div style="font-size:11px;color:#8a94a6">东财→腾讯双源·AMOUNT/VOL</div>`;
    w.appendChild(r); r.onclick=()=>openDetail(code);
  });
}
ensureWatch();

async function fetchEastKline(code, count){
  try{
    const sid=secid(code);
    const url=`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sid}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&beg=0&end=20500000&lmt=${count}`;
    const j=await fetch(url).then(r=>r.json());
    const klines=j?.data?.klines;
    if(!klines||klines.length<20) return null;
    return klines.map(s=>{
      const v=s.split(',');
      const o=+v[1], c=+v[2], h=+v[3], l=+v[4], volHand=+v[5], amount=+v[6], turn=v[10]?+v[10]/100:0;
      // 东财 vol单位=手，amount=元，avg = amount / (volHand*100)
      let avg=0;
      if(volHand>0 && amount>0) avg=amount/(volHand*100);
      else avg=(h+l+c)/3;
      return {d:v[0], o, c, h, l, v:volHand*100, a:amount, turn, avg, src:'east'};
    });
  }catch(e){ return null; }
}
async function fetchTencentKline(code, count){
  try{
    const pref=tencentPrefix(code);
    const param=`${pref}${String(code).padStart(6,'0')},day,,,${count},qfq`;
    const j=await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${param}`).then(r=>r.json());
    const key=`${pref}${String(code).padStart(6,'0')}`;
    const data=j.data?.[key];
    const klines=data?.qfqday || data?.day || [];
    if(!klines.length) return null;
    // 腾讯没有amount和turn，turn用估算，avg用(H+L+C)/3
    return klines.map(k=>{
      const o=+k[1], c=+k[2], h=+k[3], l=+k[4], volHand=+k[5];
      return {d:k[0], o, c, h, l, v:volHand*100, a:0, turn:0, avg:(h+l+c)/3, src:'tencent'};
    });
  }catch{ return null; }
}
async function fetchTencentTurn(code){
  try{
    const pref=tencentPrefix(code);
    const txt=await fetch(`https://qt.gtimg.cn/q=${pref}${String(code).padStart(6,'0')}`).then(r=>r.text());
    const m=txt.match(/v_.+?="(.+?)"/);
    if(!m) return null;
    const vs=m[1].split('~');
    // s_格式：vs[8]是turn%
    let turn=0;
    if(vs[8] && vs[8].includes('%')) turn=parseFloat(vs[8])/100;
    else if(vs[38] && vs[38].includes('%')) turn=parseFloat(vs[38])/100;
    else if(vs[39] && vs[39].includes('%')) turn=parseFloat(vs[39])/100;
    return turn;
  }catch{ return null; }
}

async function getBars(code){
  let bars=await fetchEastKline(code,150);
  let src='东财';
  if(!bars){
    bars=await fetchTencentKline(code,150);
    src='腾讯(估算)';
    if(bars){
      // 腾讯没有turn，补turn：用腾讯实时turn + 历史vol比例估
      const realTurn=await fetchTencentTurn(code);
      const avgVol=bars.reduce((s,b)=>s+b.v,0)/bars.length||1;
      bars=bars.map(b=>{
        let turn=realTurn||0;
        if(!turn){
          let t=b.v/(avgVol*100);
          turn=Math.min(Math.max(t,0.001),0.25);
        }
        return {...b, turn};
      });
    }
  }
  if(!bars) return {bars:[], src:'失败'};
  // 统一钳制turn 0.1%~30%
  bars=bars.map(b=>({...b, turn:Math.min(Math.max(b.turn||0.01,0.001),0.3)}));
  // 休市判断：最后日期如果不是今天且不是周末，不追加，保持昨天收盘，不会出现turn=0的今天
  return {bars, src};
}

function build(bars){
  const n=bars.length;
  let minP=Math.min(...bars.map(b=>b.l));
  let maxP=Math.max(...bars.map(b=>b.h));
  const GRID=300;
  const step=(maxP-minP)/GRID;
  let dist=new Array(GRID).fill(0);
  const cost50=new Array(n), cost75=new Array(n), cost90=new Array(n), zq=new Array(n), zq1=new Array(n), vwma=new Array(n);
  for(let i=0;i<n;i++){
    let sumCV=0,sumV=0;
    for(let k=Math.max(0,i-9);k<=i;k++){ sumCV+=bars[k].c*bars[k].v; sumV+=bars[k].v; }
    vwma[i]=sumV?sumCV/sumV:bars[i].c;
  }
  for(let i=0;i<n;i++){
    const b=bars[i];
    const turn=b.turn;
    for(let g=0;g<GRID;g++) dist[g]*=(1-turn);
    const low=b.l, high=b.h, avg=b.avg;
    const lowIdx=Math.max(0, Math.min(GRID-1, Math.floor((low-minP)/step)));
    const highIdx=Math.max(0, Math.min(GRID-1, Math.floor((high-minP)/step)));
    let avgIdx=Math.floor((avg-minP)/step);
    avgIdx=Math.max(lowIdx, Math.min(highIdx, avgIdx));
    let weights=[];
    for(let g=lowIdx; g<=highIdx; g++){
      let w=1;
      if(highIdx===lowIdx) w=1;
      else if(g<=avgIdx){ const d=avgIdx-lowIdx||1; w=(g-lowIdx)/d; if(avgIdx===lowIdx) w=1; }
      else{ const d=highIdx-avgIdx||1; w=(highIdx-g)/d; if(highIdx===avgIdx) w=1; }
      weights.push(Math.max(0,w));
    }
    if(weights.every(w=>w===0)) weights=weights.map(()=>1);
    const sumW=weights.reduce((a,b)=>a+b,0)||1;
    for(let j=0;j<weights.length;j++) dist[lowIdx+j]+=weights[j]/sumW*turn;
    const total=dist.reduce((a,b)=>a+b,0)||1;
    let cum=0,c50=0,c75=0,c90=0;
    for(let g=0;g<GRID;g++){ cum+=dist[g]; const price=minP+g*step; if(!c50 && cum/total>=0.5) c50=price; if(!c75 && cum/total>=0.75) c75=price; if(!c90 && cum/total>=0.9) c90=price; }
    cost50[i]=c50||b.c; cost75[i]=c75||b.c; cost90[i]=c90||b.c;
    function winner(price){ let win=0; for(let g=0;g<GRID;g++){ if(minP+g*step<=price) win+=dist[g]; } return win/total*100; }
    zq[i]=winner(b.avg);
    zq1[i]=winner(vwma[i]);
  }
  return {cost50,cost75,cost90,zq,zq1,vwma,minP,maxP,dist};
}
function setup(c){ const dpr=window.devicePixelRatio||1; const w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr; const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); return {ctx,w,h}; }

async function openDetail(code){
  document.getElementById('detail').classList.add('open');
  document.getElementById('dtitle').textContent=code+' · 拉取中...';
  const {bars, src}=await getBars(code);
  if(bars.length<20){ document.getElementById('dinfo').textContent='拉取失败，境外被限，请切换网络'; return; }
  const res=build(bars);
  const displayBars=bars.slice(-60);
  const offset=bars.length-displayBars.length;
  const inds={cost50:res.cost50.slice(offset), cost75:res.cost75.slice(offset), cost90:res.cost90.slice(offset), zq:res.zq.slice(offset), zq1:res.zq1.slice(offset)};
  const last=displayBars[displayBars.length-1];
  const lastIdx=inds.cost50.length-1;
  document.getElementById('dtitle').textContent=`${code} · ${src} · ${displayBars[0].d}~${last.d}`;
  document.getElementById('dinfo').innerHTML=`数据源 ${src} ${last.src==='east'?'有amount/vol':'无amount降级(H+L+C)/3'}\n最后 ${last.d} 收${last.c} 换手${(last.turn*100).toFixed(2)}% 均价${last.avg.toFixed(2)} = ${last.src==='east'?`amount/(vol*100) ${last.a.toFixed(0)}/(${last.v} )`:'(H+L+C)/3'}\nCOST50 ${inds.cost50[lastIdx].toFixed(2)} COST75 ${inds.cost75[lastIdx].toFixed(2)} COST90 ${inds.cost90[lastIdx].toFixed(2)} ← 通达信 13.43/13.84/15.13\nZQ ${inds.zq[lastIdx].toFixed(2)} ZQ1 ${inds.zq1[lastIdx].toFixed(2)} ← 通达信 5.21/37.98\n区间 ${res.minP.toFixed(2)}~${res.maxP.toFixed(2)} 300格 三角峰值=均价 AMOUNT/VOL`;

  const mainC=document.getElementById('mainC'), subC=document.getElementById('subC');
  const {ctx,w,h}=setup(mainC); const {ctx:ctx2,w:w2,h:h2}=setup(subC);
  const padX=14, padY=h*0.12;
  const min=Math.min(...displayBars.map(b=>b.l)), max=Math.max(...displayBars.map(b=>b.h));
  const yMin=min-(max-min)*0.05, yMax=max+(max-min)*0.15;
  const y=v=>h-padY-(v-yMin)/(yMax-yMin)*(h-padY*2);
  const x=i=>padX + i/(displayBars.length-1)*(w-padX*2);
  ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,w,h);
  const bw=Math.max(4, (w-padX*2)/displayBars.length*0.5);
  displayBars.forEach((b,i)=>{ const xx=x(i); const up=b.c>=b.o; ctx.fillStyle=up?'#ff3b3b':'#00c873'; ctx.strokeStyle=ctx.fillStyle; ctx.beginPath(); ctx.moveTo(xx,y(b.h)); ctx.lineTo(xx,y(b.l)); ctx.lineWidth=1; ctx.stroke(); const yo=y(b.o), yc=y(b.c); ctx.fillRect(xx-bw/2, Math.min(yo,yc), bw, Math.max(2,Math.abs(yo-yc))); });
  function drawLine(arr,color){ ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1.5; arr.forEach((v,i)=>{ const xx=x(i), yy=y(v); if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }); ctx.stroke(); }
  drawLine(inds.cost50,'#2ecc71'); drawLine(inds.cost75,'#ffcc00'); drawLine(inds.cost90,'#ff4d4d');
  ctx2.fillStyle='#0a0e14'; ctx2.fillRect(0,0,w2,h2);
  const zy=v=>h2-10-v/100*(h2-20); const zx=i=>padX + i/(displayBars.length-1)*(w2-padX*2);
  ctx2.save(); ctx2.strokeStyle='rgba(255,255,255,0.15)'; ctx2.setLineDash([3,3]); ctx2.beginPath(); ctx2.moveTo(0,zy(50)); ctx2.lineTo(w2,zy(50)); ctx2.stroke(); ctx2.setLineDash([]); ctx2.restore();
  function drawSub(arr,color){ ctx2.beginPath(); ctx2.strokeStyle=color; ctx2.lineWidth=1.5; arr.forEach((v,i)=>{ const xx=zx(i), yy=zy(v); if(i===0) ctx2.moveTo(xx,yy); else ctx2.lineTo(xx,yy); }); ctx2.stroke(); }
  drawSub(inds.zq,'#a855f7'); drawSub(inds.zq1,'#3b82f6');
}
document.getElementById('closeBtn').onclick=()=>document.getElementById('detail').classList.remove('open');
document.getElementById('log').textContent=`V11双源AMOUNT/VOL版：\n1. 均价用通达信 AMOUNT/VOL：东财 amount/(vol*100)，baostock amount/vol同公式，兼容\n2. 双源：优先东财(有amount/turn 8.31%)，失败自动切腾讯(无amount降级(H+L+C)/3，turn用实时8.31%或估算，不会0)\n3. 休市不追加今天，不会出现换手0.00%\n4. 后台用baostock，不限境外，GitHub Actions可跑，数据同口径\n5. 150天min-max切300格，三角峰值=均价，ZQ=WINNER(均价) ZQ1=WINNER(10日VWMA)`;
document.getElementById('add').onclick=()=>{
  let c=document.getElementById('code').value.replace(/\D/g,'').padStart(6,'0');
  if(!/^\d{6}$/.test(c)) return;
  watch=watch.filter(x=>x!==c); watch.unshift(c); localStorage.setItem('v5_watch',JSON.stringify(watch)); ensureWatch(); openDetail(c);
};
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
