</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V5.13 今日长K线修复版</title><style>

<div id="app">
<div class="card"><div class="hd"><span>指数 · 秒开(已修复)</span><div style="display:flex;gap:6px;align-items:center"><select id="srcSel"><option value="tencent">腾讯(快)</option><option value="eastmoney">东财</option><option value="auto">自动轮询</option></select><span id="t" style="font-size:11px;color:#8a94a6"></span></div></div><div id="idx"></div></div>
<div class="card"><div class="hd"><span>自选 · 断档补齐 · COST/ZQ/ZQ1当日参与</span><span id="badge" class="badge">检测中</span></div><div id="watch"></div><div style="padding:8px;display:flex;gap:8px"><input id="code" placeholder="600000" style="flex:1;background:#1c2532;border:1px solid #232f40;color:#fff;border-radius:8px;padding:9px"><button id="add" style="background:#3a8bff;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700">添加</button></div></div>

</div>
<div class="detail" id="detail"><div style="padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0a0e14;z-index:2"><span id="dtitle" style="font-weight:700"></span><button id="closeBtn" style="background:#232f40;color:#fff;border:0;border-radius:8px;padding:6px 10px">关闭</button></div>
<div class="kbox" style="position:relative"><div id="loadingMask" class="loading" style="display:none">加载中...</div><canvas id="mainC" style="height:280px"></canvas><canvas id="subC" style="height:120px;margin-top:8px"></canvas><div id="dinfo" class="hint" style="text-align:left"></div></div></div>
<script>
const REPO='itssteepturn-lgtm/stock-data-v5';
const RAW=`https://raw.githubusercontent.com/${REPO}/main`;
let SRC=localStorage.getItem('v5_src')||'tencent';
document.getElementById('srcSel').value=SRC;
document.getElementById('srcSel').onchange=e=>{SRC=e.target.value; localStorage.setItem('v5_src',SRC); loadIdx(); loadWatch();};
function isIndexCode(c){
  c=String(c).padStart(6,'0');
  return ['000001','399001','399006','000688','899050','000300','000905'].includes(c) || (c.startsWith('399') && c.length===6) || c==='000001' || c==='000688' || c.startsWith('899');
}
function secid(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688'||c==='000300'||c==='000905'||c.startsWith('60')||c.startsWith('68')) return '1.'+c; return '0.'+c; }
function tencentPrefix(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688'||c==='000300'||c.startsWith('60')||c.startsWith('68')) return 'sh'; return 'sz'; }
let watch=JSON.parse(localStorage.getItem('v5_watch')||'["000001","399006","600519","300313"]');
function ensureIdx(){
  const w=document.getElementById('idx'); if(w.children.length) return;
  ['000001','399001','399006','000688','899050'].forEach(code=>{
    const r=document.createElement('div'); r.className='row'; r.id='ir_'+code; r.innerHTML=`<span>${code} ${isIndexCode(code)?'(指数)':''}</span><span id="ip_${code}">--</span>`; w.appendChild(r); r.onclick=()=>openDetail(code);
  });
}
function ensureWatch(){
  const w=document.getElementById('watch'); if(w.children.length===watch.length) return false;
  w.innerHTML=''; watch.forEach(code=>{
    const r=document.createElement('div'); r.className='row'; r.id='wr_'+code;
    r.innerHTML=`<div><div style="font-weight:700">${code}</div><div id="ws_${code}" style="font-size:10px;color:#8a94a6">--</div></div><div style="text-align:right"><div id="wp_${code}" style="font-weight:700">--</div><div id="wc_${code}" style="font-size:11px">--</div></div>`;
    w.appendChild(r); r.onclick=()=>openDetail(code);
  }); return true;
}
ensureIdx(); ensureWatch();

async function fetchQt(codes){
  const qlist=codes.map(c=>`s_${tencentPrefix(c)}${String(c).padStart(6,'0')}`);
  const txt=await fetch(`https://qt.gtimg.cn/q=${qlist.join(',')}`).then(r=>r.text());
  const map={};
  txt.split(';').forEach(l=>{
    const m=l.match(/v_(.+?)="(.+?)"/); if(!m) return;
    const vs=m[2].split('~');
    // 腾讯格式校正：3=price, 4=prev, 5=open, 33=high, 34=low, 6=vol
    const price=parseFloat(vs[3]);
    const prev=parseFloat(vs[4]);
    const open=parseFloat(vs[5]);
    let high=parseFloat(vs[33]);
    let low=parseFloat(vs[34]);
    // 收盘后 high/low 可能为空，校正
    if(isNaN(high) || high<=0) high=Math.max(price, open||price);
    if(isNaN(low) || low<=0) low=Math.min(price, open||price);
    // 异常长K线保护：high/low偏离超过20%视为异常，用open/close钳制
    if(high>0 && price>0){
      if(high>price*1.21) high=Math.max(price, open||price);
      if(low>0 && low<price*0.79) low=Math.min(price, open||price);
    }
    const vol=parseFloat(vs[6]);
    if(!isNaN(price)) map[m[1]]={price,prev,change:price-prev,pct:prev?(price-prev)/prev*100:0,open,high,low,vol,key:m[1]};
  });
  return {map};
}
async function fetchEast(codes){
  const map={};
  for(const code of codes){
    try{
      const sid=secid(code);
      const j=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=${sid}&fields=f43,f44,f45,f46,f57,f60`).then(r=>r.json());
      const d=j.data; if(!d) continue;
      let price=d.f43/100, prev=d.f60/100, open=d.f46/100, high=d.f44/100, low=d.f45/100, vol=d.f57;
      if(isNaN(high)||high<=0) high=Math.max(price,open||price);
      if(isNaN(low)||low<=0) low=Math.min(price,open||price);
      if(high>price*1.21) high=Math.max(price,open||price);
      if(low<price*0.79) low=Math.min(price,open||price);
      map[`s_${tencentPrefix(code)}${String(code).padStart(6,'0')}`]={price,prev,change:price-prev,pct:prev?(price-prev)/prev*100:0,open,high,low,vol};
    }catch{}
  }
  return {map};
}
async function getTemp(codes){
  const sources={tencent:fetchQt, eastmoney:fetchEast};
  if(SRC==='auto'){
    for(const k of ['tencent','eastmoney']){
      try{ const r=await sources[k](codes); if(Object.keys(r.map).length) return r.map; }catch{}
    }
    return {};
  }else{
    try{ const r=await sources[SRC](codes); return r.map; }catch{ return {}; }
  }
}
async function loadIdx(){
  const codes=['000001','399001','399006','000688','899050'];
  const map=await getTemp(codes);
  codes.forEach(code=>{
    const key=`s_${tencentPrefix(code)}${code}`;
    const d=map[key];
    const el=document.getElementById('ip_'+code);
    if(d&&el){ const up=d.change>=0; el.textContent=`${d.price.toFixed(2)} ${(d.pct>0?'+':'')+d.pct.toFixed(2)}%`; el.className=up?'up':'down'; }
  });
}
async function loadWatch(){
  if(ensureWatch()) return;
  const map=await getTemp(watch);
  watch.forEach(code=>{
    const key=`s_${tencentPrefix(code)}${code}`;
    const d=map[key];
    const pEl=document.getElementById('wp_'+code), cEl=document.getElementById('wc_'+code);
    if(d&&pEl){ const up=d.change>=0; pEl.textContent=d.price.toFixed(2); pEl.className=up?'up':'down'; cEl.textContent=`${(d.pct>0?'+':'')+d.pct.toFixed(2)}%`; cEl.className=up?'up':'down'; }
  });
}
async function getHistRaw(code){
  const c=String(code).padStart(6,'0');
  const urls=[`${RAW}/data/history/${c}.json`, `${RAW}/data/stocks/${c}.json`];
  for(const url of urls){
    try{ const r=await fetch(url+`?t=${Date.now()}`); if(r.ok){ const j=await r.json(); const arr=Array.isArray(j)?j:(j.bars||j.data||[]); if(arr.length>=10) return arr; } }catch{}
  }
  return [];
}
async function getTencentKline(code, count=90){
  try{
    const pref=tencentPrefix(code);
    const param=`${pref}${String(code).padStart(6,'0')},day,,,${count},qfq`;
    const j=await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${param}`).then(r=>r.json());
    const key=`${pref}${String(code).padStart(6,'0')}`;
    const data=j.data?.[key];
    const klines=data?.qfqday || data?.day || [];
    if(!klines.length) return [];
    return klines.map(k=>({d:k[0], o:+k[1], c:+k[2], h:+k[3], l:+k[4], v:+k[5]*100}));
  }catch{ return []; }
}
async function getGapFill(fromDate, toDate, code){
  try{
    const sid=secid(code);
    const j=await fetch(`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sid}&klt=101&fqt=1&beg=${fromDate.replace(/-/g,'')}&end=${toDate.replace(/-/g,'')}&fields2=f51,f52,f53,f54,f55,f56`).then(r=>r.json());
    return (j.data.klines||[]).map(s=>{const a=s.split(','); return {d:a[0], o:+a[1], c:+a[2], h:+a[3], l:+a[4], v:+a[5]};});
  }catch{ return []; }
}
async function getToday(code){
  const map=await getTemp([code]);
  const key=`s_${tencentPrefix(code)}${String(code).padStart(6,'0')}`;
  return map[key]||null;
}
function dateStr(d){ return d.toISOString().slice(0,10); }
async function getFullBars(code){
  let hist=await getHistRaw(code);
  if(!hist || hist.length<5){
    const tk=await getTencentKline(code,90);
    if(tk.length>5) hist=tk;
  }
  if(!hist || hist.length<5){
    try{
      const sid=secid(code);
      const j=await fetch(`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sid}&klt=101&fqt=1&lmt=89&fields2=f51,f52,f53,f54,f55,f56`).then(r=>r.json());
      const k=(j.data.klines||[]).map(s=>{const a=s.split(','); return {d:a[0], o:+a[1], c:+a[2], h:+a[3], l:+a[4], v:+a[5]};});
      if(k.length>5) hist=k;
    }catch{}
  }
  const today=await getToday(code);
  let bars=[]; let note=[];
  if(hist && hist.length){
    bars=[...hist];
    const lastDate=hist[hist.length-1].d;
    const last = new Date(lastDate);
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    if(last < yesterday){
      const gap=await getGapFill(lastDate, dateStr(yesterday), code);
      if(gap.length){ bars.push(...gap); note.push(`自养到${lastDate}，断档${gap.length}天已补`); }
      else note.push(`自养到${lastDate}，无断档`);
    }else note.push(`自养到${lastDate}，无断档`);
  }else note.push('无自养，临时用线上90根补');
  
  if(today){
    // 修复今日长K线：钳制high/low，避免low=0导致全图压扁
    let o=today.open, h=today.high, l=today.low, c=today.price;
    if(isNaN(o)||o<=0) o=c;
    if(isNaN(h)||h<=0) h=Math.max(o,c);
    if(isNaN(l)||l<=0) l=Math.min(o,c);
    // 异常检测：如果 high/low 偏离收盘价超过11%（涨跌停板），视为异常数据，用 open/close 钳制
    if(h>c*1.11) h=Math.max(o,c);
    if(l<c*0.89) l=Math.min(o,c);
    if(h<Math.max(o,c)) h=Math.max(o,c);
    if(l>Math.min(o,c)) l=Math.min(o,c);
    const todayBar={d:'今日实时', o, h, l, c, v:today.vol||0};
    if(bars.length && bars[bars.length-1].d==='今日实时') bars[bars.length-1]=todayBar; else bars.push(todayBar);
    note.push('今日1根实时已捏合，COST/ZQ/ZQ1全部参与今日计算，陡升当日可见');
  }
  if(bars.length>120) bars=bars.slice(-120);
  return {bars, note:note.join('；')};
}
function smooth(arr, period=5){
  if(arr.length<=period) return arr;
  const res=[arr[0]]; const k=2/(period+1);
  for(let i=1;i<arr.length;i++) res[i]=arr[i]*k + res[i-1]*(1-k);
  return res;
}
function computeIndicators(bars){
  const n=bars.length;
  const cost50=new Array(n).fill(0), cost75=new Array(n).fill(0), cost90=new Array(n).fill(0);
  const zq=new Array(n).fill(0), zq1=new Array(n).fill(0), vwma=new Array(n).fill(0);
  for(let i=0;i<n;i++){
    let sumCV=0,sumV=0; for(let k=Math.max(0,i-9);k<=i;k++){sumCV+=bars[k].c*bars[k].v; sumV+=bars[k].v;} vwma[i]=sumV?sumCV/sumV:bars[i].c;
    const start=Math.max(0,i-89); const slice=bars.slice(start,i+1); const totalVol=slice.reduce((s,b)=>s+b.v,0)||1;
    function winner(price){ let win=0; for(let b of slice) if(b.c<=price) win+=b.v; return win/totalVol*100; }
    zq[i]=winner(bars[i].c); zq1[i]=winner(vwma[i]);
    function costN(pct){ const sorted=[...slice].sort((a,b)=>a.c-b.c); let cum=0; for(let b of sorted){ cum+=b.v; if(cum/totalVol*100>=pct) return b.c; } return sorted[sorted.length-1]?.c||bars[i].c; }
    cost50[i]=costN(50); cost75[i]=costN(75); cost90[i]=costN(90);
  }
  return { cost50:smooth(cost50,7), cost75:smooth(cost75,7), cost90:smooth(cost90,7), zq:smooth(zq,5), zq1:smooth(zq1,5), vwma };
}
function setup(c){ const dpr=window.devicePixelRatio||1; const w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr; const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); return {ctx,w,h}; }
let currentCode=null;
async function openDetail(code){
  currentCode=code;
  const detail=document.getElementById('detail');
  const mask=document.getElementById('loadingMask');
  detail.classList.add('open'); mask.style.display='flex';
  document.getElementById('dtitle').textContent=code+' · 加载中...';
  const mainC=document.getElementById('mainC'), subC=document.getElementById('subC');
  setup(mainC); setup(subC);
  document.getElementById('dinfo').textContent='加载中...';
  const {bars, note}=await getFullBars(code);
  if(currentCode!==code) return;
  mask.style.display='none';
  if(!bars.length){ document.getElementById('dinfo').textContent='无数据'; return; }
  const isIdx=isIndexCode(code);
  document.getElementById('dtitle').textContent=code+ (isIdx?' · 指数':' · 断档补齐+今日捏合');
  let infoHtml=`<div>${note}</div><div>共${bars.length}根，最新 ${bars[bars.length-1].c.toFixed(2)} ${bars[bars.length-1].d==='今日实时'?'(今日实时已参与)':''}</div>`;
  if(!isIdx){
    const inds=computeIndicators(bars);
    infoHtml+=`<div>COST50 ${inds.cost50[inds.cost50.length-1].toFixed(2)} COST75 ${inds.cost75[inds.cost75.length-1].toFixed(2)} COST90 ${inds.cost90[inds.cost90.length-1].toFixed(2)} <span style="color:#ff3b3b">←已含今日，陡升当日可见</span></div><div>ZQ ${inds.zq[inds.zq.length-1].toFixed(1)} ZQ1 ${inds.zq1[inds.zq1.length-1].toFixed(1)} <span style="color:#ffcc00">←已含今日，陡升当日可见，但本身很稳不晃</span></div>`;
    drawK(bars, inds, false);
  }else{
    infoHtml+=`<div style="color:#8a94a6">指数不计算COST/ZQ，无意义</div>`;
    drawK(bars, null, true);
  }
  document.getElementById('dinfo').innerHTML=infoHtml;
}
function drawK(bars, inds, isIdx){
  const mainC=document.getElementById('mainC'), subC=document.getElementById('subC');
  const {ctx,w,h}=setup(mainC); const {ctx:ctx2,w:w2,h:h2}=setup(subC);
  const min=Math.min(...bars.map(b=>b.l)), max=Math.max(...bars.map(b=>b.h)); const y=v=>h-10-(v-min)/(max-min||1)*(h-20);
  bars.forEach((b,i)=>{
    const x=i/(bars.length-1||1)*w; const up=b.c>=b.o; ctx.fillStyle=up?'#ff3b3b':'#00c873';
    ctx.fillRect(x-2.5, y(Math.max(b.o,b.c)), 5, Math.abs(y(b.o)-y(b.c))||2);
    ctx.fillRect(x-0.5, y(b.h), 1, y(b.l)-y(b.h));
    if(b.d==='今日实时'){ ctx.strokeStyle='#ff3b3b'; ctx.setLineDash([3,3]); ctx.strokeRect(x-5, y(b.h)-5, 10, y(b.l)-y(b.h)+10); ctx.setLineDash([]); }
  });
  if(!isIdx && inds){
    ctx.beginPath(); inds.cost50.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#00ff88'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); inds.cost75.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#ffcc00'; ctx.stroke();
    ctx.beginPath(); inds.cost90.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#ff3b3b'; ctx.stroke();
    const zy=v=>h2-10-v/100*(h2-20);
    ctx2.beginPath(); inds.zq.forEach((v,i)=>{const x=i/(bars.length-1||1)*w2; if(i===0) ctx2.moveTo(x,zy(v)); else ctx2.lineTo(x,zy(v));}); ctx2.strokeStyle='#ffcc00'; ctx2.stroke();
    ctx2.beginPath(); inds.zq1.forEach((v,i)=>{const x=i/(bars.length-1||1)*w2; if(i===0) ctx2.moveTo(x,zy(v)); else ctx2.lineTo(x,zy(v));}); ctx2.strokeStyle='#fff'; ctx2.stroke();
  }else{
    const ma=(p)=>{ const r=[]; for(let i=0;i<bars.length;i++){ let s=0,c=0; for(let k=Math.max(0,i-p+1);k<=i;k++){s+=bars[k].c;c++;} r.push(s/c);} return r; };
    const ma5=ma(5), ma10=ma(10);
    ctx.beginPath(); ma5.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#ffcc00'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ma10.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#3a8bff'; ctx.stroke();
    const maxV=Math.max(...bars.map(b=>b.v)); const yv=v=>h2-5-v/maxV*(h2-10);
    bars.forEach((b,i)=>{ const x=i/(bars.length-1||1)*w2; const up=b.c>=b.o; ctx2.fillStyle=up?'#ff3b3b55':'#00c87355'; ctx2.fillRect(x-2,yv(b.v),4,h2-5-yv(b.v)); });
  }
}
document.getElementById('closeBtn').onclick=()=>{ currentCode=null; document.getElementById('detail').classList.remove('open'); };
loadIdx(); loadWatch();
setInterval(loadIdx,30000);
setInterval(loadWatch,8000);
document.getElementById('add').onclick=()=>{
  let c=document.getElementById('code').value.replace(/\D/g,'').padStart(6,'0');
  if(!/^\d{6}$/.test(c)) return alert('6位');
