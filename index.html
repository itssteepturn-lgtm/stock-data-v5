<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>盘面 V4</title>
<style>
:root{--bg:#0a0e14;--panel:#141a24;--panel2:#1c2532;--line:#232f40;--line2:#2a394e;--text:#e8ecf2;--dim:#8a94a6;--up:#ff3b3b;--down:#00c873;--yellow:#ffcc00;--green:#2ecc71;--red:#ff4d4d;--accent:#3a8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Helvetica,sans-serif;overflow-x:hidden}
#app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;padding:0 0 90px;overflow-x:hidden}
@media(min-width:600px){#app{max-width:500px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 8px 0;padding:0;overflow:hidden}
.card-hd{padding:10px 12px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.card-hd b{font-size:13px;letter-spacing:.3px}
.card-bd{padding:0}
.hint{font-size:11px;color:var(--dim);padding:10px 12px;text-align:center}
.up{color:var(--up)}.down{color:var(--down)}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;width:100%}

/* index panel - one row per index full width */
.idx-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.idx-row:last-child{border-bottom:none}
.idx-left{width:44%;display:flex;flex-direction:column;gap:2px}
.idx-name{font-size:13px;font-weight:700}
.idx-price-line{font-size:12px;display:flex;gap:6px;align-items:baseline}
.idx-canvas-wrap{display:flex;gap:8px;flex:1}
.idx-k{width:54px;height:40px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.idx-fen{flex:1;height:40px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}

/* watchlist - full width row with intraday */
.watch-row{position:relative;display:flex;align-items:center;gap:0;padding:0;border-bottom:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:72px}
.watch-row:last-child{border:none}
.watch-row.pinned{background:rgba(58,139,255,.08)}
.watch-info{width:92px;padding:10px 8px 10px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.watch-code{font-size:11px;color:var(--dim)}
.watch-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-pct{font-size:12px;font-weight:600}
.watch-chart{flex:1;height:68px;position:relative;background:var(--bg);margin:4px 4px 4px 0;border-radius:8px;border:1px solid var(--line);overflow:hidden}
.watch-actions{position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:2}
.act-btn{font-size:10px;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid var(--line2);color:var(--dim)}
.act-btn.pin.on{background:var(--accent);color:#fff}

/* detail */
#detail{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0);z-index:20;overflow-y:auto;max-width:430px;margin:0 auto}
#detail.open{transform:translateY(0)}
.detail-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}
.canvas-wrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px}
#mainCanvas{width:100%;height:280px;display:block}
#subCanvas{width:100%;height:140px;display:block;border-top:1px solid var(--line)}
#intraCanvas{width:100%;height:180px;display:block;border-top:1px dashed var(--line2)}
#cross-tip{position:absolute;top:8px;left:8px;font-size:10px;background:rgba(0,0,0,.8);padding:6px 8px;border-radius:8px;pointer-events:none;line-height:1.5;max-width:90%;display:none;z-index:3;border:1px solid var(--line2)}
.v-divider{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.15);pointer-events:none}
.zero-line{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.25);pointer-events:none}

/* cond builder */
#cond-builder{display:flex;gap:8px;padding:8px}
#cond-palette{width:140px;flex-shrink:0;max-height:60vh;overflow:auto}
.pal-g{margin-bottom:12px}
.pal-g-t{font-size:10px;color:var(--dim);margin-bottom:6px;letter-spacing:.6px;text-transform:uppercase}
.pal-item{font-size:11px;padding:8px 8px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;background:var(--bg);cursor:pointer;line-height:1.3}
.pal-item b{display:block;font-size:11px;margin-bottom:2px}
.pal-item.active{border-color:var(--accent);background:rgba(58,139,255,.12)}
#cond-active{flex:1;min-height:200px}
.act-card{border:1px solid var(--accent);background:rgba(58,139,255,.1);border-radius:10px;padding:10px;margin-bottom:8px;position:relative}
.act-card .rm{position:absolute;top:8px;right:10px;color:var(--dim);cursor:pointer;font-size:14px}
.param-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px}
.param-row label{width:70px;color:var(--dim);flex-shrink:0}
.param-row input,.param-row select{flex:1;padding:5px 6px;font-size:11px}

/* result waterfall */
.result-row{border-bottom:1px solid var(--line);padding:0;background:var(--panel);margin:8px 8px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.result-hd{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.result-hd b{font-size:13px}
.result-canvas-wrap{position:relative;background:var(--bg)}
.result-main{width:100%;height:160px;display:block}
.result-sub{width:100%;height:80px;display:block;border-top:1px solid var(--line)}
.add-self{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--accent);color:#fff;border:none;cursor:pointer}

#data-sync-card{margin:8px;border:1px dashed var(--line);background:transparent;opacity:.7}
</style>
</head>
<body>
<div id="netBanner" style="display:none;padding:10px 12px;background:#ffcc00;color:#000;text-align:center;font-weight:700;font-size:13px;position:sticky;top:0;z-index:5">⚠️ 数据加载慢，请切换网络后刷新</div>
<div id="app">
  <!-- 指数 - 一行一指数 -->
  <div class="card" id="index-card">
    <div class="card-hd"><b>指数</b><span id="idx-time" style="font-size:10px;color:var(--dim)">加载中</span></div>
    <div id="index-list"></div>
  </div>

  <!-- 自选 -->
  <div class="card" id="watch-card">
    <div class="card-hd"><b>自选 · 3s刷新 · 占满宽幅分时</b><span style="font-size:10px;color:var(--dim)">新加置顶</span></div>
    <div id="watch-list"></div>
    <div style="display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)">
      <input id="add-code" placeholder="代码 600000 / 300313" style="flex:1">
      <button id="add-btn" class="btn btn-primary" style="padding:8px 16px">添加</button>
    </div>
  </div>

  <!-- 选股 -->
  <div class="card">
    <div class="card-hd"><b>形态积木 · 2K组合 · C50-SPD等代号</b><span id="cond-count" style="font-size:10px;color:var(--dim)">0个条件</span></div>
    <div style="font-size:10px;color:var(--dim);padding:6px 12px">点击左侧添加，右侧改参。全部AND，支持英文代号防外泄。ZQ-VAL等小参数可配合</div>
    <div id="cond-builder">
      <div id="cond-palette"></div>
      <div id="cond-active"><div class="hint">添加 C50-SPD / C75-UTD / ZQ-HOLD / ZQ-ACC-DIVE / ZQ-PAIR-DIVE</div></div>
    </div>
    <div style="display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)">
      <button id="run-scan" class="btn btn-primary" style="flex:1">扫描选股 · 瀑布流</button>
      <button id="clear-cond" class="btn">清空</button>
      <button id="stop-scan" class="btn" style="display:none">停止</button>
    </div>
    <div id="scan-progress" class="hint"></div>
  </div>

  <!-- 结果瀑布流 -->
  <div id="results-wrap"></div>

  <!-- 数据同步卡片放底部 -->
  <div class="card" id="data-sync-card">
    <div class="card-hd"><b style="font-size:11px">数据同步</b><span id="data-status-text" style="font-size:10px;color:var(--dim)">检查中...</span></div>
    <div style="padding:8px 12px;font-size:10px;color:var(--dim)" id="data-status-detail"></div>
  </div>
</div>

<!-- 详情 -->
<div id="detail">
  <div class="detail-top">
    <div id="back-btn" style="font-size:26px;cursor:pointer;line-height:1">‹</div>
    <div id="detail-title" style="font-weight:700;font-size:14px;flex:1"></div>
    <div id="detail-sub" style="font-size:11px;color:var(--dim)"></div>
  </div>
  <div class="canvas-wrap" id="detail-canvas-wrap">
    <canvas id="mainCanvas"></canvas>
    <canvas id="subCanvas"></canvas>
    <canvas id="intraCanvas"></canvas>
    <div id="cross-tip"></div>
  </div>
  <div class="hint" id="chart-hint">点击K线：光标锁定，分时切换到当天；再点：光标消失，回今日分时。光标同步主图+副图</div>
  <div id="detail-info" class="card" style="margin:8px"><div class="hint">加载中</div></div>
</div>

<script type="module">
// ===== Data base =====
const DATA_REPO='itssteepturn-lgtm/stock-data-v3';
const RAW_BASE=`https://raw.githubusercontent.com/${DATA_REPO}/main`;
const CDN_BASE=`https://cdn.jsdelivr.net/gh/${DATA_REPO}@main`;
let DATA_BASE=RAW_BASE;
const DISPLAY=80, CALC=350;

// ===== localStorage watchlist =====
let watchList = JSON.parse(localStorage.getItem('v4_watch')||'[]');
if(!watchList.length) watchList=['000001','399006','300313','301628'];
function saveWatch(){localStorage.setItem('v4_watch', JSON.stringify(watchList));}

// ===== helpers =====
function limitPct(code){
  code=String(code);
  if(code.startsWith('30')||code.startsWith('68')) return 20;
  if(code.startsWith('8')||code.startsWith('4')||code.startsWith('92')) return 30;
  return 10;
}
function secid(code){
  code=String(code).padStart(6,'0');
  if(code.startsWith('6')) return `1.${code}`;
  if(code.startsWith('0')||code.startsWith('3')) return `0.${code}`;
  if(code.startsWith('8')||code.startsWith('4')||code.startsWith('92')) return `0.${code}`;
  return `1.${code}`;
}

// ===== compute indicators - COST/ZQ/ZQ1 with WINNER =====
function computeIndicators(bars){
  const n=bars.length;
  const cost50=new Array(n).fill(0), cost75=new Array(n).fill(0), cost90=new Array(n).fill(0);
  const zq=new Array(n).fill(0), zq1=new Array(n).fill(0);
  const vwma=new Array(n).fill(0);
  // prefix total vol not enough for decaying, use simple window total
  for(let i=0;i<n;i++){
    // VWMA10
    let sumCV=0,sumV=0;
    for(let k=Math.max(0,i-9);k<=i;k++){sumCV+=bars[k].close*bars[k].vol; sumV+=bars[k].vol;}
    vwma[i]= sumV? sumCV/sumV : bars[i].close;
    // WINNER helper - within window CALC
    const start=Math.max(0,i-349);
    const slice=bars.slice(start,i+1);
    const totalVol=slice.reduce((s,b)=>s+b.vol,0)||1;
    function winner(price){
      let win=0;
      for(let b of slice) if(b.close<=price) win+=b.vol;
      return win/totalVol*100;
    }
    // ZQ: WINNER(avg price) avg~close
    const avgPrice=bars[i].close; // AMOUNT/V/100 approx close
    zq[i]=winner(avgPrice);
    zq1[i]=winner(vwma[i]);
    // COST: find price where winner >= N
    function costN(pct){
      // sort by close
      const sorted=[...slice].sort((a,b)=>a.close-b.close);
      let cum=0;
      for(let b of sorted){
        cum+=b.vol;
        if(cum/totalVol*100>=pct) return b.close;
      }
      return sorted[sorted.length-1]?.close||bars[i].close;
    }
    cost50[i]=costN(50);
    cost75[i]=costN(75);
    cost90[i]=costN(90);
  }
  return {cost50,cost75,cost90,zq,zq1,vwma};
}

// ===== canvas helpers =====
function setupCanvas(canvas){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=rect.width||canvas.clientWidth, h=rect.height||canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawZeroAxis(ctx,w,h, yFunc, prevClose){
  const y0=yFunc(prevClose);
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke();
  ctx.restore();
}
function drawNoonDivider(ctx,w,h){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  const x=w*0.5;
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
  ctx.restore();
}

// ===== fetch history bars =====
async function getHistBars(code, need=CALC){
  const c=String(code).padStart(6,'0');
  const url=`${DATA_BASE}/data/history/${c}.json?t=${Date.now()}`;
  try{
    const j=await fetch(url).then(r=>r.json());
    const arr=j.bars||j;
    return arr.slice(-need).map(b=>({date:b.date||b.d, open:+b.open||+b.o, high:+b.high||+b.h, low:+b.low||+b.l, close:+b.close||+b.c, vol:+b.vol||+b.v, amount:+b.amount||0, prevClose:+b.prevClose||0}));
  }catch{
    // fallback eastmoney kline
    try{
      const sc=secid(c);
      const kl=await fetch(`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sc}&klt=101&fqt=1&lmt=${need}&fields2=f51,f52,f53,f54,f55,f56,f57,f58`).then(r=>r.json());
      const lines=kl?.data?.klines||[];
      return lines.map(k=>{const a=k.split(','); return {date:a[0], open:+a[1], close:+a[2], high:+a[3], low:+a[4], vol:+a[5], amount:+a[6]};});
    }catch{return [];}
  }
}
async function getIntraday(code){
  const sc=secid(code);
  try{
    const url=`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sc}&klt=1&fqt=1&lmt=242&fields2=f51,f52,f53,f54,f55,f56`;
    const j=await fetch(url).then(r=>r.json());
    const lines=j?.data?.klines||[];
    const prev=j?.data?.preKPrice||0;
    const pts=lines.map(l=>{const a=l.split(','); return {time:a[0], price:+a[2], vol:+a[5]};});
    return {pts, prevClose: prev || pts[0]?.price || 0};
  }catch{return {pts:[], prevClose:0};}
}

// ===== indices =====
const INDICES=[
  {name:'上证', code:'000001', secid:'1.000001'},
  {name:'深证', code:'399001', secid:'0.399001'},
  {name:'创业', code:'399006', secid:'0.399006'},
  {name:'科创50', code:'000688', secid:'1.000688'},
  {name:'北证50', code:'899050', secid:'0.899050'},
];
async function fetchIdxSnapshot(secid){
  try{
    const j=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f44,f45,f46,f58,f60`).then(r=>r.json());
    const d=j?.data; if(!d) return null;
    return {price:d.f43, prev:d.f60, chg:(d.f43-d.f60)/d.f60*100};
  }catch{return null;}
}
async function fetchIdxKline(secid){
  try{
    const j=await fetch(`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&klt=101&fqt=1&lmt=40&fields2=f51,f52,f53,f54,f55,f56`).then(r=>r.json());
    return (j?.data?.klines||[]).map(k=>{const a=k.split(','); return {close:+a[2]};});
  }catch{return [];}
}
async function renderIndices(){
  const wrap=document.getElementById('index-list');
  wrap.innerHTML='';
  document.getElementById('idx-time').textContent=new Date().toLocaleTimeString();
  for(const idx of INDICES){
    const row=document.createElement('div'); row.className='idx-row';
    row.innerHTML=`
      <div class="idx-left">
        <div class="idx-name">${idx.name}</div>
        <div class="idx-price-line"><span id="ip_${idx.code}" style="font-weight:700">--</span><span id="ic_${idx.code}" style="font-size:11px">--</span></div>
      </div>
      <div class="idx-canvas-wrap">
        <canvas class="idx-k" id="ik_${idx.code}"></canvas>
        <canvas class="idx-fen" id="if_${idx.code}"></canvas>
      </div>
    `;
    wrap.appendChild(row);
    (async()=>{
      const [snap, kl, intra]=await Promise.all([fetchIdxSnapshot(idx.secid), fetchIdxKline(idx.secid), getIntraday(idx.code)]);
      const pEl=document.getElementById(`ip_${idx.code}`);
      const cEl=document.getElementById(`ic_${idx.code}`);
      const isUp=snap ? snap.price>=snap.prev : (kl[kl.length-1]?.close||0)>=(kl[0]?.close||0);
      if(snap){
        pEl.textContent=snap.price.toFixed(2); pEl.className=isUp?'up':'down';
        cEl.textContent=`${snap.chg>0?'+':''}${snap.chg.toFixed(2)}%`; cEl.className=isUp?'up':'down';
      }
      // draw K spark
      const kc=document.getElementById(`ik_${idx.code}`); if(kc&&kl.length){ const {ctx,w,h}=setupCanvas(kc); const closes=kl.map(b=>b.close); const min=Math.min(...closes),max=Math.max(...closes); const pad=(max-min)*0.2||max*0.01; const y=v=>h-2-(v-(min-pad))/(max-min+pad*2||1)*(h-4); ctx.clearRect(0,0,w,h); ctx.beginPath(); closes.forEach((c,i)=>{const x=i/(closes.length-1||1)*w, yy=y(c); if(i==0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);}); ctx.strokeStyle=isUp?'#ff3b3b':'#00c873'; ctx.lineWidth=1.2; ctx.stroke();}
      // draw fen mini with zero + noon divider
      const fc=document.getElementById(`if_${idx.code}`); if(fc&&intra.pts.length){
        const {ctx,w,h}=setupCanvas(fc);
        const prices=intra.pts.map(p=>p.price);
        const prev=intra.prevClose||prices[0];
        const lim=0.05; // index 5%
        const yMin=prev*(1-lim), yMax=prev*(1+lim);
        const y=v=>h-2-(v-yMin)/(yMax-yMin||1)*(h-4);
        ctx.clearRect(0,0,w,h);
        drawZeroAxis(ctx,w,h,y,prev); drawNoonDivider(ctx,w,h);
        ctx.beginPath(); prices.forEach((p,i)=>{const x=i/(prices.length-1||1)*w; const yy=y(p); if(i==0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);}); ctx.strokeStyle=isUp?'#ff3b3b':'#00c873'; ctx.lineWidth=1; ctx.stroke();
      }
    })();
    row.onclick=()=>openDetail({code:idx.code, name:idx.name});
  }
}
renderIndices(); setInterval(renderIndices, 60000);

// ===== watchlist with intraday full-width =====
async function renderWatch(){
  const wrap=document.getElementById('watch-list'); wrap.innerHTML='';
  for(let idx=0; idx<watchList.length; idx++){
    const code=watchList[idx];
    const row=document.createElement('div'); row.className='watch-row'; if(idx===0) row.classList.add('pinned');
    row.innerHTML=`
      <div class="watch-info">
        <div class="watch-name" id="wn_${code}">${code}</div>
        <div class="watch-code">${code}</div>
        <div class="watch-pct" id="wp_${code}">--</div>
      </div>

      </div>
    `;

      const pctEl=document.getElementById(`wp_${code}`);
      const nameEl=document.getElementById(`wn_${code}`);
      // try fetch name via snapshot? fallback
      if(snap){
        const chg=snap.chg;
        pctEl.textContent=`${snap.price.toFixed(2)} ${chg>0?'+':''}${chg.toFixed(2)}%`;
        pctEl.className=`watch-pct ${snap.price>=snap.prev?'up':'down'}`;
      }
      const canvas=document.getElementById(`wc_${code}`);
      if(canvas && intra.pts.length){
        const {ctx,w,h}=setupCanvas(canvas);
        const prices=intra.pts.map(p=>p.price);
        const prev=intra.prevClose||snap?.prev||prices[0];
        const lim=limitPct(code)/100;
        const yMin=prev*(1-lim), yMax=prev*(1+lim);
        const y=v=>h-2-(v-yMin)/(yMax-yMin||1)*(h-4);
        ctx.clearRect(0,0,w,h);
        // grid
        ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(0,0,w,h);
        drawZeroAxis(ctx,w,h,y,prev); drawNoonDivider(ctx,w,h);
        // price line
        const isUp=(prices[prices.length-1]||prev)>=prev;
        ctx.beginPath();
        prices.forEach((p,i)=>{const x=i/(prices.length-1||1)*w; const yy=y(p); if(i==0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);});
        ctx.strokeStyle=isUp?'#ff3b3b':'#00c873'; ctx.lineWidth=1.2; ctx.stroke();
        // fill area
        ctx.lineTo(w,y(prev)); ctx.lineTo(0,y(prev)); ctx.closePath(); ctx.fillStyle=isUp?'rgba(255,59,59,.12)':'rgba(0,200,115,.12)'; ctx.fill();
        // last price label
        ctx.fillStyle=isUp?'#ff3b3b':'#00c873'; ctx.font='10px sans-serif';
        ctx.fillText(prices[prices.length-1].toFixed(2), w-42, y(prices[prices.length-1])-4);
      }
    })();
    row.onclick=(e)=>{
      if(e.target.closest('.act-btn')) return;
      openDetail({code});
    };
  }
  // bind actions
  wrap.querySelectorAll('.act-btn').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const code=btn.dataset.code, act=btn.dataset.act;
      if(act==='del'){ watchList=watchList.filter(c=>c!==code); saveWatch(); renderWatch(); }
      if(act==='pin'){ watchList=watchList.filter(c=>c!==code); watchList.unshift(code); saveWatch(); renderWatch(); }
    };
  });
}

let detailBars=[], detailInds=null, cursorIdx=null, detailCode=null, detailIntra=null, detailIntraHist={};
async function openDetail({code,name}){

  </div>`;

function drawDetail(){
  if(!detailBars.length) return;
  const mainCanvas=document.getElementById('mainCanvas');
  const subCanvas=document.getElementById('subCanvas');
  const intraCanvas=document.getElementById('intraCanvas');
  const {ctx:mc,w:mw,h:mh}=setupCanvas(mainCanvas);
  const {ctx:sc,w:sw,h:sh}=setupCanvas(subCanvas);
  const {ctx:ic,w:iw,h:ih}=setupCanvas(intraCanvas);
  const start=Math.max(0, detailBars.length-DISPLAY);
  const bars=detailBars.slice(start);
  const inds={
    cost50:detailInds.cost50.slice(start),
    cost75:detailInds.cost75.slice(start),
    cost90:detailInds.cost90.slice(start),
    zq:detailInds.zq.slice(start),
    zq1:detailInds.zq1.slice(start),
  };
  const minL=Math.min(...bars.map(b=>b.low), ...inds.cost50, ...inds.cost75, ...inds.cost90)*0.98;
  const maxH=Math.max(...bars.map(b=>b.high), ...inds.cost50, ...inds.cost75, ...inds.cost90)*1.02;
  const yMain=v=> mh-20 - (v-minL)/(maxH-minL||1)*(mh-30);
  const xMain=i=> (i/(bars.length-1||1))*mw;
  // clear
  mc.clearRect(0,0,mw,mh); sc.clearRect(0,0,sw,sh); ic.clearRect(0,0,iw,ih);
  // grid main
  mc.fillStyle='#0a0e14'; mc.fillRect(0,0,mw,mh);
  // draw K
  const bw=Math.max(2, mw/bars.length*0.6);
  bars.forEach((b,i)=>{
    const x=xMain(i);
    const isUp=b.close>=b.open;
    mc.strokeStyle=isUp?'#ff3b3b':'#00c873'; mc.fillStyle=mc.strokeStyle;
    const yO=yMain(b.open), yC=yMain(b.close), yH=yMain(b.high), yL=yMain(b.low);
    mc.beginPath(); mc.moveTo(x,yH); mc.lineTo(x,yL); mc.stroke();
    const top=Math.min(yO,yC), h=Math.max(2, Math.abs(yO-yC));
    mc.fillRect(x-bw/2, top, bw, h||2);
  });
  // cost lines
  function drawLine(arr,color){
    mc.beginPath(); mc.strokeStyle=color; mc.lineWidth=1.2;
    arr.forEach((v,i)=>{const x=xMain(i), y=yMain(v); if(i==0) mc.moveTo(x,y); else mc.lineTo(x,y);}); mc.stroke();
  }
  drawLine(inds.cost50,'#2ecc71'); // green
  drawLine(inds.cost75,'#ffcc00'); // yellow
  drawLine(inds.cost90,'#ff4d4d'); // red
  // sub - ZQ
  sc.fillStyle='#0a0e14'; sc.fillRect(0,0,sw,sh);
  const ySub=v=> sh-10 - v/100*(sh-20);
  // 50 middle line
  sc.save(); sc.strokeStyle='#ff3b3b'; sc.setLineDash([4,4]); sc.beginPath(); sc.moveTo(0,ySub(50)); sc.lineTo(sw,ySub(50)); sc.stroke(); sc.restore();
  sc.save(); sc.strokeStyle='rgba(255,255,255,.1)'; sc.beginPath(); sc.moveTo(0,ySub(0)); sc.lineTo(sw,ySub(0)); sc.stroke(); sc.beginPath(); sc.moveTo(0,ySub(100)); sc.lineTo(sw,ySub(100)); sc.stroke(); sc.restore();
  function drawSubLine(arr,color){
    sc.beginPath(); sc.strokeStyle=color; sc.lineWidth=1.2;
    arr.forEach((v,i)=>{const x=i/(arr.length-1||1)*sw; const y=ySub(v); if(i==0) sc.moveTo(x,y); else sc.lineTo(x,y);}); sc.stroke();
  }
  drawSubLine(inds.zq,'#ffcc00'); // ZQ yellow
  drawSubLine(inds.zq1,'#ffffff'); // ZQ1 white
  // intraday
  ic.fillStyle='#0a0e14'; ic.fillRect(0,0,iw,ih);
  let intraPts, prevClose;
  if(cursorIdx!==null){
    // load hist intraday for that date - simplified: use that day's OHLC to simulate? For now show K close as prev
    const b=bars[cursorIdx];
    intraPts=null; prevClose=bars[Math.max(0,cursorIdx-1)]?.close||b.open;
    // draw flat line + info
    ic.fillStyle='rgba(255,255,255,.05)'; ic.fillRect(0,0,iw,ih);
    ic.fillStyle='#fff'; ic.font='11px sans-serif'; ic.fillText(`${b.date} 当天分时切换(数据源对接中) 收${b.close}`, 10, 20);
  } else {
    intraPts=detailIntra?.pts||[]; prevClose=detailIntra?.prevClose||bars[bars.length-1]?.open||0;
  }
  if(intraPts && intraPts.length){
    const prices=intraPts.map(p=>p.price);
    const lim=limitPct(detailCode)/100;
    const yMin=prevClose*(1-lim), yMax=prevClose*(1+lim);
    const y=v=> ih-20 - (v-yMin)/(yMax-yMin||1)*(ih-30);
    const x=i=> i/(intraPts.length-1||1)*iw;
    // zero axis
    ic.save(); ic.strokeStyle='rgba(255,255,255,.35)'; ic.setLineDash([3,3]); ic.beginPath(); ic.moveTo(0,y(prevClose)); ic.lineTo(iw,y(prevClose)); ic.stroke(); ic.restore();
    // noon divider
    ic.save(); ic.strokeStyle='rgba(255,255,255,.15)'; ic.setLineDash([4,4]); ic.beginPath(); ic.moveTo(iw*0.5,0); ic.lineTo(iw*0.5,ih); ic.stroke(); ic.restore();
    // price
    const lastPrice=prices[prices.length-1];
    const isUp=lastPrice>=prevClose;
    ic.beginPath(); prices.forEach((p,i)=>{const xx=x(i), yy=y(p); if(i==0) ic.moveTo(xx,yy); else ic.lineTo(xx,yy);}); ic.strokeStyle=isUp?'#ff3b3b':'#00c873'; ic.lineWidth=1.2; ic.stroke();
    // labels
    ic.fillStyle=isUp?'#ff3b3b':'#00c873'; ic.font='11px sans-serif';
    const chgPct=((lastPrice-prevClose)/prevClose*100);
    ic.fillText(`${lastPrice.toFixed(2)} ${chgPct>0?'+':''}${chgPct.toFixed(2)}%`, 8, 14);
    // VOL at bottom of intraday - simple
    // draw vol bars if have vol
    const vols=intraPts.map(p=>p.vol); const maxV=Math.max(...vols,1);
    const vh=30;
    ic.fillStyle='rgba(100,120,140,.5)';
    vols.forEach((v,i)=>{const xx=x(i); const h=v/maxV*vh; ic.fillRect(xx, ih-h, 2, h);});
  } else if(!intraPts){
    // draw when cursor selected but no intraday - show price lines
    const yMin=minL, yMax=maxH;
    // already nothing
  }
  // cursor
  if(cursorIdx!==null){
    const x=xMain(cursorIdx);
    [mc,sc,ic].forEach(c=>{c.save(); c.strokeStyle='rgba(255,255,255,.6)'; c.setLineDash([4,4]); c.beginPath(); c.moveTo(x,0); c.lineTo(x, c===mc?mh: c===sc?sh:ih); c.stroke(); c.restore();});
    const b=bars[cursorIdx];
    document.getElementById('cross-tip').style.display='block';
    document.getElementById('cross-tip').innerHTML=`
      <div>${b.date} O${b.open} H${b.high} L${b.low} C${b.close}</div>
      <div style="color:#2ecc71">C50:${inds.cost50[cursorIdx].toFixed(2)} <span style="color:#ffcc00">C75:${inds.cost75[cursorIdx].toFixed(2)}</span> <span style="color:#ff4d4d">C90:${inds.cost90[cursorIdx].toFixed(2)}</span></div>
      <div style="color:#ffcc00">ZQ:${inds.zq[cursorIdx].toFixed(1)} <span style="color:#fff">ZQ1:${inds.zq1[cursorIdx].toFixed(1)}</span></div>
    `;
  } else {
    document.getElementById('cross-tip').style.display='none';
  }
}

// ===== evaluate stock for 2K形态 =====
function evalCond(tplId, bars, inds, idx, params){
  if(idx<2) return false;
  const c50=inds.cost50, c75=inds.cost75, c90=inds.cost90, zq=inds.zq, zq1=inds.zq1;
  switch(tplId){
    case 'C50-SPD':{
      const slopePrev=(c50[idx-1]-c50[idx-2])/ (c50[idx-2]||1)*100;
      const slopeCurr=(c50[idx]-c50[idx-1])/(c50[idx-1]||1)*100;
      const keepUp=c50[idx] > c50[Math.max(0,idx-params.keepUp)];
      return slopePrev>=params.steep && slopeCurr<0 && Math.abs(slopeCurr)<=params.press && keepUp;
    }
    case 'C75-UTD':{
      let up=true; for(let k=1;k<=params.upDays;k++){ if(c75[idx-k]<=c75[idx-k-1]) up=false; }
      const downPct=(c75[idx-1]-c75[idx])/ (c75[idx-1]||1)*100;
      return up && downPct>=params.downPct;
    }
    case 'C50-STEEP':{
      const pct=(c50[idx]-c50[idx-1])/(c50[idx-1]||1)*100;
      return pct>=params.pct;
    }
    case 'C90-ALIGN':{
      const gap=(c90[idx]-c50[idx])/ (c50[idx]||1)*100;
      return params.type==='粘合'? gap<=params.maxGap : gap>=params.maxGap;
    }
    case 'ZQ-HOLD':{
      const gap=zq[idx]-zq1[idx];
      const osc=Math.abs(zq[idx]-zq[idx-1]);
      return zq[idx]>=params.zqMin && zq1[idx]<=params.zq1Max && gap>=params.gapMin && osc<=params.oscMax;
    }
    case 'ZQ-ACC-DIVE':{
      const drop=zq[idx-1]-zq[idx];
      const prevDrop=zq[idx-2]-zq[idx-1];
      const isHigh=zq[idx-1]>=params.highTh;
      const accCheck=params.acc==='否' || drop>prevDrop;
      return isHigh && drop>=params.dropMin && accCheck && zq[idx]<zq[idx-1];
    }
    case 'ZQ-PAIR-DIVE':{
      const tight=Math.abs(zq[idx]-zq1[idx])<=params.tight;
      const bothDown= zq[idx]<zq[idx-1] && zq1[idx]<zq1[idx-1];
      return params.bothDown==='否'? tight : tight && bothDown;
    }
    case 'ZQ-VAL':{
      return zq[idx]>=params.min && zq[idx]<=params.max && zq1[idx]>=params.min1 && zq1[idx]<=params.max1;
    }
    case 'ZQ-GAP':{
      const gap=Math.abs(zq[idx]-zq1[idx]); return gap>=params.min && gap<=params.max;
    }
    case 'VOL-SPIKE':{
      if(idx==0) return false; return bars[idx].vol > bars[idx-1].vol*params.times;
    }
    case 'PRICE-POS':{
      const line=inds[params.line][idx]; return params.op==='>'? bars[idx].close>line : bars[idx].close<line;
    }
    default: return true;
  }
}
function evaluateStock(bars, inds, idx, active){
  for(const c of active){ if(!evalCond(c.templateId,bars,inds,idx,c.params)) return false; } return true;
}

  const wrap=document.getElementById('results-wrap'); wrap.innerHTML='<div class="card"><div class="hint">扫描中...会显示瀑布流，每行带K线和副图</div></div>';
  let codes;
  try{ codes=await fetch(`${DATA_BASE}/data/codes.json`).then(r=>r.json()); }catch{ codes=await fetch(`${DATA_BASE}/data/latest.json`).then(r=>r.json()).then(a=>a.map(x=>({code:x.c||x.code}))); }
  const list=codes.map(x=>x.code||x.c).slice(0,5000);
  let matched=0;
  const batch=20;
  for(let i=0;i<list.length;i+=batch){
    if(stopScan) break;
    const slice=list.slice(i,i+batch);
    await Promise.all(slice.map(async code=>{
      const bars=await getHistBars(code, CALC);
      if(bars.length<40) return;
      const inds=computeIndicators(bars);
      const idx=bars.length-1;
      if(evaluateStock(bars,inds,idx,activeConditions)){
        matched++;
        // create result row with canvases
        const row=document.createElement('div'); row.className='result-row';
        row.innerHTML=`
          <div class="result-hd"><b>${code} ${bars[idx].date}</b><span style="font-size:11px;color:var(--dim)">C50:${inds.cost50[idx].toFixed(1)} ZQ:${inds.zq[idx].toFixed(0)} ZQ1:${inds.zq1[idx].toFixed(0)}</span><button class="add-self" data-code="${code}">加自选</button></div>
          <div class="result-canvas-wrap"><canvas class="result-main" id="rm_${code}_${idx}"></canvas><canvas class="result-sub" id="rs_${code}_${idx}"></canvas></div>
        `;
        wrap.appendChild(row);
        // draw after appended
        setTimeout(()=>{
          const barsSlice=bars.slice(-60);
          const indsSlice={cost50:inds.cost50.slice(-60), cost75:inds.cost75.slice(-60), cost90:inds.cost90.slice(-60), zq:inds.zq.slice(-60), zq1:inds.zq1.slice(-60)};
          const c1=document.getElementById(`rm_${code}_${idx}`);
          const c2=document.getElementById(`rs_${code}_${idx}`);
          if(!c1||!c2) return;
          const {ctx,w,h}=setupCanvas(c1);
          const minL=Math.min(...barsSlice.map(b=>b.low), ...indsSlice.cost50)*0.98;
          const maxH=Math.max(...barsSlice.map(b=>b.high), ...indsSlice.cost90)*1.02;
          const y=v=>h-10-(v-minL)/(maxH-minL||1)*(h-20);
          const x=i=>i/(barsSlice.length-1||1)*w;
          ctx.clearRect(0,0,w,h); ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,w,h);
          const bw=Math.max(2,w/barsSlice.length*0.5);
          barsSlice.forEach((b,i)=>{
            const xx=x(i); const isUp=b.close>=b.open; ctx.strokeStyle=isUp?'#ff3b3b':'#00c873'; ctx.fillStyle=ctx.strokeStyle;
            const yO=y(b.open), yC=y(b.close), yH=y(b.high), yL=y(b.low);
            ctx.beginPath(); ctx.moveTo(xx,yH); ctx.lineTo(xx,yL); ctx.stroke();
            const top=Math.min(yO,yC); const hh=Math.max(2,Math.abs(yO-yC)); ctx.fillRect(xx-bw/2, top, bw, hh);
          });
          // cost lines
          function dl(arr,color){ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1; arr.forEach((v,i)=>{const xx=x(i), yy=y(v); if(i==0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);}); ctx.stroke();}
          dl(indsSlice.cost50,'#2ecc71'); dl(indsSlice.cost75,'#ffcc00'); dl(indsSlice.cost90,'#ff4d4d');
          // sub
          const {ctx:ctx2,w:w2,h:h2}=setupCanvas(c2);
          ctx2.clearRect(0,0,w2,h2); ctx2.fillStyle='#0a0e14'; ctx2.fillRect(0,0,w2,h2);
          const y2=v=>h2-6-v/100*(h2-12);
          ctx2.save(); ctx2.strokeStyle='#ff3b3b'; ctx2.setLineDash([3,3]); ctx2.beginPath(); ctx2.moveTo(0,y2(50)); ctx2.lineTo(w2,y2(50)); ctx2.stroke(); ctx2.restore();
          function dl2(arr,color){ctx2.beginPath(); ctx2.strokeStyle=color; ctx2.lineWidth=1; arr.forEach((v,i)=>{const xx=i/(arr.length-1||1)*w2; const yy=y2(v); if(i==0) ctx2.moveTo(xx,yy); else ctx2.lineTo(xx,yy);}); ctx2.stroke();}
          dl2(indsSlice.zq,'#ffcc00'); dl2(indsSlice.zq1,'#fff');
        },50);
        row.querySelector('.add-self').onclick=()=>{
          if(!watchList.includes(code)){watchList.unshift(code); saveWatch(); renderWatch();}
        };
        row.onclick=(e)=>{ if(e.target.closest('.add-self')) return; openDetail({code}); };
      }
    }));
    document.getElementById('scan-progress').textContent=`已扫 ${Math.min(i+batch,list.length)}/${list.length} 命中 ${matched}`;
    if(matched>150) break;
  }
  document.getElementById('stop-scan').style.display='none';
  if(matched===0) wrap.innerHTML='<div class="card"><div class="hint">没有符合的，试试放宽 ZQ-VAL 或 C-SLOPE</div></div>';
};
document.getElementById('stop-scan').onclick=()=>{stopScan=true;};

// ===== data status =====
async function checkStatus(){
  try{
    const r=await fetch(`${RAW_BASE}/data/meta.json?t=${Date.now()}`); if(!r.ok) throw 0;
    const meta=await r.json();
    document.getElementById('data-status-text').textContent=`库内 ${meta.total}支 · ${meta.lastUpdateDate}`;
    document.getElementById('data-status-detail').textContent=meta.note||'';
  }catch{
    document.getElementById('data-status-text').textContent='数据未就绪';
  }
}
checkStatus();

// auto refresh watchlist intraday every 3s
setInterval(renderWatch, 3000);
