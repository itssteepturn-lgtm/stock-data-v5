<script>
function secid(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688'||c==='000300'||c==='000905') return '1.'+c; if(c.startsWith('60')||c.startsWith('68')) return '1.'+c; return '0.'+c; }
function tencentPrefix(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688') return 'sh'; if(c.startsWith('60')||c.startsWith('68')) return 'sh'; return 'sz'; }
function limitPct(code){
  code=String(code).padStart(6,'0');
  if(code.startsWith('30')||code.startsWith('68')) return 0.20;
  if(code.startsWith('8')||code.startsWith('4')||code.startsWith('92')) return 0.30;
  return 0.10;
}
let watch=JSON.parse(localStorage.getItem('v5_watch')||'["300313","600519","000001","399006"]');

function ensureIdx(){
  const w=document.getElementById('idx'); if(w.children.length) return;
  [
    {code:'000001',name:'上证',secid:'1.000001'},

    {code:'399006',name:'创业',secid:'0.399006'},
    {code:'000688',name:'科创50',secid:'1.000688'},

    r.innerHTML=`<div><div style="font-weight:700">${idx.name} ${idx.code}</div><div id="ic_${idx.code}" style="font-size:11px;color:#8a94a6">--</div></div><div style="text-align:right"><div id="ip_${idx.code}" style="font-weight:700">--</div><div id="id_${idx.code}" style="font-size:11px">--</div></div>`;
    w.appendChild(r); r.onclick=()=>openDetail(idx.code, true);
  });
}
function ensureWatch(){
  const w=document.getElementById('watch'); if(w.children.length===watch.length) return false;
  w.innerHTML=''; watch.forEach(code=>{
    const r=document.createElement('div'); r.className='row'; r.id='wr_'+code;
    r.innerHTML=`<div><div style="font-weight:700">${code}</div><div id="ws_${code}" style="font-size:10px;color:#8a94a6"></div></div><div style="text-align:right"><div id="wp_${code}" style="font-weight:700">--</div><div id="wc_${code}" style="font-size:11px">--</div></div>`;
    w.appendChild(r); r.onclick=()=>openDetail(code, false);
  }); return true;
}
ensureIdx(); ensureWatch();

// 指数和自选价格：腾讯批量，修复-8000%
async function fetchQtBatch(codes, isIdxList=false){
  const qlist=codes.map(c=>{
    const cc=String(c).padStart(6,'0');
    if(isIdxList){
      if(cc==='000001'||cc==='000688') return `sh${cc}`;
      if(cc.startsWith('399')||cc==='899050') return `sz${cc}`;
    }
    return `${tencentPrefix(cc)}${cc}`;
  });
  const txt=await fetch(`https://qt.gtimg.cn/q=${qlist.join(',')}`).then(r=>r.text());
  const map={};
  txt.split(';').forEach(l=>{
    const m=l.match(/v_(.+?)="(.+?)"/); if(!m) return;
    const vs=m[2].split('~');
    let price=parseFloat(vs[3]);
    let prev=parseFloat(vs[4]);
    let open=parseFloat(vs[5]), high=parseFloat(vs[33]), low=parseFloat(vs[34]);
    let change, pct;
    if(isNaN(prev) || Math.abs(prev)<1 || vs[4]==='' ){
      change=parseFloat(vs[4]);
      pct=parseFloat(vs[5]);
      if(vs[5] && vs[5].includes('%')) pct=parseFloat(vs[5]);
      prev=price-change;
      if(isNaN(pct)) pct=prev? change/prev*100:0;
      if(isNaN(open)) open=prev||price;
    }else{
      change=price-prev;
      pct=prev? change/prev*100:0;
      const pct2=parseFloat(vs[32]);
      if(!isNaN(pct2) && Math.abs(pct2)<30) pct=pct2;
    }
    if(isNaN(high)||high<=0) high=Math.max(price,open||price);
    if(isNaN(low)||low<=0) low=Math.min(price,open||price);
    const lim=0.3;
    if(high>price*(1+lim*1.05)) high=Math.max(price,open||price);
    if(low<price*(1-lim*1.05)) low=Math.min(price,open||price);
    if(!isNaN(price)) map[m[1]]={price,prev,pct,open,high,low,change};
  });
  return map;
}
// 东财实时：拿真实turn f168，均价
async function fetchEastTurn(code){
  try{
    const sid=secid(code);
    const j=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=${sid}&fields=f43,f44,f45,f46,f57,f58,f168`).then(r=>r.json());
    const d=j?.data; if(!d) return null;
    let vol=d.f57||0, amount=d.f58||0;
    let turn=d.f168!=null?d.f168/100:0;
    if(turn>1) turn=turn/100;
    return {vol, amount, turn, avgPrice: vol? amount/vol/100 : 0}; // 东财amount单位是元*100？
  }catch{ return null; }
}
async function fetchEastKlineTurn(code, count){
  // 东财K线带真实turn，用于150天历史turn
  try{
    const sid=secid(code);
    // f168历史？用kline接口
    const j=await fetch(`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sid}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&beg=0&end=20500000&lmt=${count}`).then(r=>r.json());
    const klines=j?.data?.klines;
    if(!klines||!klines.length) return null;
    return klines.map(s=>{
      const v=s.split(',');
      // f51 date, f52 open, f53 close, f54 high, f55 low, f56 vol, f57 amount, f58 振幅, f59 涨跌幅, f60 涨跌额, f61 换手率
      return {
        d:v[0], o:+v[1], c:+v[2], h:+v[3], l:+v[4], v:+v[5], a:+v[6], turn: v[10] ? +v[10]/100 : 0
      };
    });
  }catch{ return null; }
}

let idxTimer=null, watchTimer=null;
async function loadIdx(){
  document.getElementById('idx-time').textContent=new Date().toLocaleTimeString();
  const codes=['000001','399001','399006','000688','899050'];
  const map=await fetchQtBatch(codes, true);
  codes.forEach(code=>{
    let found=null; for(const k in map){ if(k.includes(code)){ found=map[k]; break; } }
    const pEl=document.getElementById('ip_'+code), dEl=document.getElementById('id_'+code), cEl=document.getElementById('ic_'+code);
    if(found&&pEl&&found.price>0){
      const up=found.change>=0;
      pEl.textContent=found.price.toFixed(2); pEl.className=up?'up':'down';
      dEl.textContent=(found.pct>0?'+':'')+found.pct.toFixed(2)+'%'; dEl.className=up?'up':'down';
      cEl.textContent=`昨${found.prev.toFixed(2)}`;
    }
  });
}
async function loadWatch(){
  if(ensureWatch()) return;
  try{
    const map=await fetchQtBatch(watch, false);
    watch.forEach(code=>{
      let found=null; for(const k in map){ if(k.includes(code)){ found=map[k]; break; } }
      const pEl=document.getElementById('wp_'+code), cEl=document.getElementById('wc_'+code);
      if(found&&pEl){
        const up=found.change>=0;
        pEl.textContent=found.price.toFixed(2); pEl.className=up?'up':'down';
        cEl.textContent=(found.pct>0?'+':'')+found.pct.toFixed(2)+'%'; cEl.className=up?'up':'down';
      }
    });
  }catch{}
}
function startTimers(){
  if(idxTimer) clearInterval(idxTimer);
  if(watchTimer) clearInterval(watchTimer);
  loadIdx(); loadWatch();
  idxTimer=setInterval(loadIdx, 30000);
  watchTimer=setInterval(loadWatch, 3000);
}
startTimers();

// ===== V8调试版：全临时150天，不读库 =====
async function getTencentKline(code, count, isIdx){
  try{
    const pref=isIdx? (code==='000001'||code==='000688'?'sh':'sz') : tencentPrefix(code);
    const param=`${pref}${String(code).padStart(6,'0')},day,,,${count},qfq`;
    const j=await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${param}`).then(r=>r.json());
    const key=`${pref}${String(code).padStart(6,'0')}`;
    const data=j.data?.[key];
    const klines=data?.qfqday || data?.day || [];
    if(!klines.length) return [];
    return klines.map(k=>({d:k[0], o:+k[1], c:+k[2], h:+k[3], l:+k[4], v:+k[5]*100, a:0, turn:0}));
  }catch{ return []; }
}

async function getFullBarsTemp(code, isIdx){
  // 1. 优先东财带turn的150天
  let bars=await fetchEastKlineTurn(code, 150);
  if(!bars || bars.length<60){
    // 2. 腾讯150天
    const tk=await getTencentKline(code, 150, isIdx);
    if(tk.length>60) bars=tk;
  }
  if(!bars || bars.length<20) return {calcBars:[], displayBars:[], note:'临时数据拉取失败'};
  // 如果东财没有turn，用估算
  const vols=bars.map(b=>b.v||0);
  const avgVol=vols.reduce((a,b)=>a+b,0)/vols.length||1;
  bars=bars.map(b=>{
    let turn=b.turn;
    if(!turn || turn<=0){
      let t=b.v/(avgVol*100);
      if(!isFinite(t)||t<=0) t=0.008;
      turn=Math.min(Math.max(t,0.001),0.25);
    }
    return {...b, turn};
  });
  // 今日实时
  let qt=null, east=null;
  try{
    const qmap=await fetchQtBatch([code], isIdx);
    for(const k in qmap){ if(k.includes(code)){ qt=qmap[k]; break; } }
  }catch{}
  try{ east=await fetchEastTurn(code); }catch{}
  if(qt){
    let turn=east && east.turn && east.turn>0 ? east.turn : 0;
    if(!turn || turn<=0){
      // 用昨日turn*0.5开盘，随东财更新
      const yTurn=bars[bars.length-1]?.turn||0.01;
      turn=yTurn*0.5;
      if(east && east.turn) turn=east.turn;
    }
    turn=Math.min(Math.max(turn,0.001),0.3);
    const lim=limitPct(code);
    let h=qt.high, l=qt.low, o=qt.open, c=qt.price;
    if(h>c*(1+lim*1.1)) h=Math.max(o,c);
    if(l<c*(1-lim*1.1)) l=Math.min(o,c);
    const avgPrice=east && east.avgPrice ? east.avgPrice : (qt.price+o+h+l)/4;
    const todayBar={d:'今日实时', o, h, l, c, v:east?east.vol:0, a:east?east.amount:0, turn, avgPrice, isToday:true};
    bars.push(todayBar);
  }
  const calcBars=bars.slice(-150);
  const displayBars=bars.slice(-60);
  return {calcBars, displayBars, note:`全临时：计算${calcBars.length}根，显示60根，价格区间150天min-max切300格，turn实时东财f168，${bars[bars.length-1]?.turn? '今日turn='+(bars[bars.length-1].turn*100).toFixed(2)+'%':''}`};
}

function buildChipDistribution(bars){
  const n=bars.length;
  if(n===0) return null;
  let minPrice=Math.min(...bars.map(b=>b.l).filter(x=>x>0));
  let maxPrice=Math.max(...bars.map(b=>b.h));
  if(!isFinite(minPrice)||minPrice<=0) minPrice=Math.min(...bars.map(b=>b.c))*0.8;
  if(maxPrice<=minPrice) maxPrice=minPrice*1.2;
  const GRID=300;
  const step=(maxPrice-minPrice)/GRID|| (maxPrice*0.001);
  let dist=new Array(GRID).fill(0);
  function getTurn(b){
    if(b.turn && b.turn>0 && b.turn<0.5) return Math.min(Math.max(b.turn,0.0005),0.3);
    return 0.01;
  }
  function getAvgPrice(b){
    if(b.avgPrice && b.avgPrice>0) return b.avgPrice;
    if(b.a && b.v) return b.a/b.v;
    return (b.h+b.l+b.c)/3;
  }
  const cost50Arr=new Array(n).fill(0), cost75Arr=new Array(n).fill(0), cost90Arr=new Array(n).fill(0);
  const zqArr=new Array(n).fill(0), zq1Arr=new Array(n).fill(0);
  const vwmaArr=new Array(n).fill(0);
  for(let i=0;i<n;i++){
    let sumCV=0,sumV=0;
    for(let k=Math.max(0,i-9);k<=i;k++){sumCV+=bars[k].c*bars[k].v; sumV+=bars[k].v;}
    vwmaArr[i]=sumV?sumCV/sumV:bars[i].c;
  }
  for(let i=0;i<n;i++){
    const b=bars[i];
    const turn=getTurn(b);
    const avgPrice=getAvgPrice(b);
    for(let g=0;g<GRID;g++) dist[g]*=(1-turn);
    const low=b.l, high=b.h;
    if(low>0 && high>0 && high>=low){
      const lowIdx=Math.max(0, Math.floor((low-minPrice)/step));
      const highIdx=Math.min(GRID-1, Math.floor((high-minPrice)/step));
      let avgIdx=Math.floor((avgPrice-minPrice)/step);
      avgIdx=Math.max(lowIdx, Math.min(highIdx, avgIdx));
      let weights=[];
      for(let g=lowIdx; g<=highIdx; g++){
        let w;
        if(highIdx===lowIdx) w=1;
        else if(g<=avgIdx){
          const denom=(avgIdx-lowIdx)||1;
          w=(g-lowIdx)/denom;
        }else{
          const denom=(highIdx-avgIdx)||1;
          w=(highIdx-g)/denom;
        }
        weights.push(Math.max(0,w));
      }
      const sumW=weights.reduce((a,b)=>a+b,0)||1;
      for(let j=0;j<weights.length;j++){
        const g=lowIdx+j;
        dist[g]+=weights[j]/sumW*turn;
      }
    }
    const total=dist.reduce((a,b)=>a+b,0)||1;
    let cum=0, c50=0,c75=0,c90=0;
    for(let g=0;g<GRID;g++){
      cum+=dist[g];
      const price=minPrice+g*step;
      if(c50===0 && cum/total>=0.5) c50=price;
      if(c75===0 && cum/total>=0.75) c75=price;
      if(c90===0 && cum/total>=0.9) c90=price;
    }
    cost50Arr[i]=c50||bars[i].c;
    cost75Arr[i]=c75||bars[i].c;
    cost90Arr[i]=c90||bars[i].c;
    function winner(price){
      let win=0;
      for(let g=0;g<GRID;g++){
        const p=minPrice+g*step;
        if(p<=price) win+=dist[g];
      }
      return win/total*100;
    }
    zqArr[i]=winner(b.c);
    zq1Arr[i]=winner(vwmaArr[i]);
  }
  return {cost50:cost50Arr, cost75:cost75Arr, cost90:cost90Arr, zq:zqArr, zq1:zq1Arr, vwma:vwmaArr, minPrice, maxPrice, dist};
}

function setup(c){ const dpr=window.devicePixelRatio||1; const w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr; const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); return {ctx,w,h}; }
let currentCode=null, currentIsIdx=false;
let cache={}; // 缓存150天计算结果，秒开
async function openDetail(code, isIdx){
  currentCode=code; currentIsIdx=isIdx;
  const detail=document.getElementById('detail');
  const mask=document.getElementById('loadingMask');
  detail.classList.add('open'); mask.style.display='flex';
  document.getElementById('dtitle').textContent=code+' · 150天筹码计算中...';
  setup(document.getElementById('mainC')); setup(document.getElementById('subC'));
  document.getElementById('dinfo').textContent='全临时150天，300格三角分布计算中...';
  // 缓存
  const cacheKey=code+'_'+(isIdx?'idx':'stk');
  let calcBars, displayBars, note, fullResult;
  if(cache[cacheKey] && !isIdx){
    // 缓存有历史分布，只算今日
    const c=cache[cacheKey];
    const {calcBars:cb, displayBars:db, note:n}=await getFullBarsTemp(code, isIdx);
    calcBars=cb; displayBars=db; note=n;
    // 用缓存的dist继续算今日
    let dist=[...c.dist];
    const lastBar=calcBars[calcBars.length-1];
    const turn=lastBar.turn||0.01;
    const avgPrice=lastBar.avgPrice||lastBar.c;
    const minPrice=c.minPrice, maxPrice=c.maxPrice, step=(maxPrice-minPrice)/300;
    const GRID=300;
    for(let g=0;g<GRID;g++) dist[g]*=(1-turn);
    const low=lastBar.l, high=lastBar.h;
    if(low>0 && high>0){
      const lowIdx=Math.max(0, Math.floor((low-minPrice)/step));
      const highIdx=Math.min(GRID-1, Math.floor((high-minPrice)/step));
      let avgIdx=Math.floor((avgPrice-minPrice)/step);
      avgIdx=Math.max(lowIdx, Math.min(highIdx, avgIdx));
      let weights=[];
      for(let g=lowIdx; g<=highIdx; g++){
        let w;
        if(highIdx===lowIdx) w=1;
        else if(g<=avgIdx){ const denom=(avgIdx-lowIdx)||1; w=(g-lowIdx)/denom; }
        else{ const denom=(highIdx-avgIdx)||1; w=(highIdx-g)/denom; }
        weights.push(Math.max(0,w));
      }
      const sumW=weights.reduce((a,b)=>a+b,0)||1;
      for(let j=0;j<weights.length;j++) dist[lowIdx+j]+=weights[j]/sumW*turn;
    }
    // 重新算COST/ZQ最后几根
    const total=dist.reduce((a,b)=>a+b,0)||1;
    let cum=0, c50=0,c75=0,c90=0;
    for(let g=0;g<GRID;g++){ cum+=dist[g]; const price=minPrice+g*step; if(c50===0 && cum/total>=0.5) c50=price; if(c75===0 && cum/total>=0.75) c75=price; if(c90===0 && cum/total>=0.9) c90=price; }
    function winner(price){ let win=0; for(let g=0;g<GRID;g++){ const p=minPrice+g*step; if(p<=price) win+=dist[g]; } return win/total*100; }
    const vwma=lastBar.c;
    const zq=winner(lastBar.c), zq1=winner(vwma);
    fullResult={cost50:[...c.cost50, c50], cost75:[...c.cost75, c75], cost90:[...c.cost90, c90], zq:[...c.zq, zq], zq1:[...c.zq1, zq1], minPrice, maxPrice, dist};
    // 显示
    const offset=calcBars.length-displayBars.length;
    var inds={cost50:fullResult.cost50.slice(offset), cost75:fullResult.cost75.slice(offset), cost90:fullResult.cost90.slice(offset), zq:fullResult.zq.slice(offset), zq1:fullResult.zq1.slice(offset)};
  }else{
    const res=await getFullBarsTemp(code, isIdx);
    calcBars=res.calcBars; displayBars=res.displayBars; note=res.note;
    if(!calcBars.length){ document.getElementById('dinfo').textContent='临时数据拉取失败'; mask.style.display='none'; return; }
    fullResult=buildChipDistribution(calcBars);
    cache[cacheKey]={...fullResult, dist:[...fullResult.dist]};

  let infoHtml=`<div>${note}</div><div>共${displayBars.length}根显示，最新 ${displayBars[displayBars.length-1].c.toFixed(2)} ${displayBars[displayBars.length-1].d==='今日实时'?'(今日实时，东财f168实时turn，盘中陡升可见)':''}</div>`;
  if(!isIdx){
    infoHtml+=`<div>COST50 ${inds.cost50[inds.cost50.length-1].toFixed(2)} COST75 ${inds.cost75[inds.cost75.length-1].toFixed(2)} COST90 ${inds.cost90[inds.cost90.length-1].toFixed(2)} <span style="color:#ff3b3b">←150天min-max切300格，三角分布</span></div><div>ZQ ${inds.zq[inds.zq.length-1].toFixed(1)} ZQ1 ${inds.zq1[inds.zq1.length-1].toFixed(1)} <span style="color:#ffcc00">←WINNER(均价)/WINNER(10日VWMA)</span></div>`;

function drawK(bars, inds, isIdx, code){
  const mainC=document.getElementById('mainC'), subC=document.getElementById('subC');
  const {ctx,w,h}=setup(mainC); const {ctx:ctx2,w:w2,h:h2}=setup(subC);
  const padX=14, padY=h*0.12;
  const min=Math.min(...bars.map(b=>b.l).filter(x=>x>0)), max=Math.max(...bars.map(b=>b.h));
  const range=(max-min)||1;
  const yMin=min-range*0.05, yMax=max+range*0.15;
  const y=v=>h-padY-(v-yMin)/(yMax-yMin||1)*(h-padY*2);
  const x=i=>padX + i/(bars.length-1||1)*(w-padX*2);
  ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,w,h);
  ctx2.fillStyle='#0a0e14'; ctx2.fillRect(0,0,w2,h2);
  const bw=Math.max(4, (w-padX*2)/bars.length*0.5);
  bars.forEach((b,i)=>{
    const xx=x(i); const up=b.c>=b.o; ctx.fillStyle=up?'#ff3b3b':'#00c873'; ctx.strokeStyle=ctx.fillStyle;
    const yO=y(b.o), yC=y(b.c), yH=y(b.h), yL=y(b.l);
    ctx.beginPath(); ctx.moveTo(xx,yH); ctx.lineTo(xx,yL); ctx.lineWidth=1; ctx.stroke();
    const top=Math.min(yO,yC), hh=Math.max(2, Math.abs(yO-yC));
    ctx.fillRect(xx-bw/2, top, bw, hh);
    if(b.isToday){ ctx.fillStyle='#ff3b3b'; ctx.font='10px sans-serif'; ctx.fillText('实时', xx+8, y(b.c)-6); }
  });
  if(!isIdx && inds){
    function drawLine(arr,color){
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1.4;
      arr.forEach((v,i)=>{const xx=x(i), yy=y(v); if(i==0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);}); ctx.stroke();
    }
    drawLine(inds.cost50,'#2ecc71');
    drawLine(inds.cost75,'#ffcc00');
    drawLine(inds.cost90,'#ff4d4d');
    const zy=v=>h2-10-v/100*(h2-20);
    const zx=i=>padX + i/(bars.length-1||1)*(w2-padX*2);
    ctx2.save(); ctx2.strokeStyle='rgba(255,255,255,0.15)'; ctx2.setLineDash([3,3]); ctx2.beginPath(); ctx2.moveTo(0,zy(50)); ctx2.lineTo(w2,zy(50)); ctx2.stroke(); ctx2.setLineDash([]); ctx2.restore();
    function drawSub(arr,color){
      ctx2.beginPath(); ctx2.strokeStyle=color; ctx2.lineWidth=1.3;
      arr.forEach((v,i)=>{const xx=zx(i), yy=zy(v); if(i==0) ctx2.moveTo(xx,yy); else ctx2.lineTo(xx,yy);}); ctx2.stroke();
    }
    drawSub(inds.zq,'#a855f7');
    drawSub(inds.zq1,'#3b82f6');
  }else{
    const ma=(p)=>{ const r=[]; for(let i=0;i<bars.length;i++){ let s=0,c=0; for(let k=Math.max(0,i-p+1);k<=i;k++){s+=bars[k].c;c++;} r.push(s/c);} return r; };
    const ma5=ma(5), ma10=ma(10);
    ctx.beginPath(); ma5.forEach((v,i)=>{const xx=x(i); if(i==0) ctx.moveTo(xx,y(v)); else ctx.lineTo(xx,y(v));}); ctx.strokeStyle='#ffcc00'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ma10.forEach((v,i)=>{const xx=x(i); if(i==0) ctx.moveTo(xx,y(v)); else ctx.lineTo(xx,y(v));}); ctx.strokeStyle='#3a8bff'; ctx.stroke();
  }
}
