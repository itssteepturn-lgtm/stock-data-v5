<div class="card"><div class="hd"><span>自选 · 60根对齐通达信 · 平滑版</span><span id="badge" class="badge">检测中</span></div><div id="watch"></div><div style="padding:8px;display:flex;gap:8px"><input id="code" placeholder="600000" style="flex:1;background:#1c2532;border:1px solid #232f40;color:#fff;border-radius:8px;padding:9px"><button id="add" style="background:#3a8bff;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700">添加</button></div></div>

<div class="kbox" style="position:relative"><div id="loadingMask" class="loading" style="display:none">加载中...</div><canvas id="mainC" style="height:300px"></canvas><canvas id="subC" style="height:120px;margin-top:8px"></canvas><div id="dinfo" class="hint"></div></div></div>
<script>
const REPO='itssteepturn-lgtm/stock-data-v5';
const RAW=`https://raw.githubusercontent.com/${REPO}/main`;

function isIndexCode(c){
  c=String(c).padStart(6,'0');
  // 明确区分：000001有两种，sz000001是股票，sh000001是指数。我们指数列表用sh
  return ['000001','399001','399006','000688','899050'].includes(c) && true;
}
function isTrueIndexDisplay(c){
  // 用于显示判断：我们首页的000001是指数sh000001
  return ['000001','399001','399006','000688','899050'].includes(String(c).padStart(6,'0'));
}
function secid(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688') return '1.'+c; if(c.startsWith('60')||c.startsWith('68')) return '1.'+c; return '0.'+c; }
function tencentPrefix(c){ c=String(c).padStart(6,'0'); if(c==='000001'||c==='000688') return 'sh'; if(c.startsWith('60')||c.startsWith('68')) return 'sh'; return 'sz'; }
// 关键：区分股票和指数的文件名，避免000001冲突
function histFileName(code, isIdx){
  const c=String(code).padStart(6,'0');
  if(isIdx){
    // 指数存为 idx_000001.json 或 sh_000001.json
    if(c==='000001') return 'idx_sh_000001.json';
    if(c==='000688') return 'idx_sh_000688.json';
    return `idx_${c}.json`;
  }
  // 股票存为 sz_000001.json / sh_600519.json
  const pref=tencentPrefix(c);
  return `${pref}_${c}.json`;
}
let watch=JSON.parse(localStorage.getItem('v5_watch')||'["000001","399006","600519","300313"]');

function ensureIdx(){
  const w=document.getElementById('idx'); if(w.children.length) return;
  [
    {code:'000001',name:'上证',secid:'1.000001'},
    {code:'399001',name:'深证',secid:'0.399001'},
    {code:'399006',name:'创业',secid:'0.399006'},
    {code:'000688',name:'科创50',secid:'1.000688'},
    {code:'899050',name:'北证50',secid:'0.899050'},
  ].forEach(idx=>{
    const r=document.createElement('div'); r.className='row'; r.id='ir_'+idx.code;
    r.innerHTML=`<div><div style="font-weight:700">${idx.name} ${idx.code}</div><div id="ic_${idx.code}" style="font-size:11px;color:#8a94a6">--</div></div><div style="text-align:right"><div id="ip_${idx.code}" style="font-weight:700">--</div><div id="id_${idx.code}" style="font-size:11px">--</div></div>`;
    w.appendChild(r); r.onclick=()=>openDetail(idx.code, true);
  });
}
function ensureWatch(){
  const w=document.getElementById('watch'); if(w.children.length===watch.length) return false;
  w.innerHTML=''; watch.forEach(code=>{
    const r=document.createElement('div'); r.className='row'; r.id='wr_'+code;
    r.innerHTML=`<div><div style="font-weight:700">${code}</div><div id="ws_${code}" style="font-size:10px;color:#8a94a6"></div></div><div style="text-align:right"><div id="wp_${code}" style="font-weight:700">--</div><div id="wc_${code}" style="font-size:11px">--</div></div>`;
    w.appendChild(r); r.onclick=()=>openDetail(code, false);
  }); return true;
}
ensureIdx(); ensureWatch();

// 修复-8000% BUG：腾讯s_格式 vs 非s_格式区分
async function fetchQtBatch(codes, isIdxList=false){
  // 对指数，我们用不带s_的格式 sh000001，这样字段是 3=price,4=prev,5=open, 32可能不是pct，所以我们自己算pct
  const qlist=codes.map(c=>{
    const cc=String(c).padStart(6,'0');
    // 指数强制sh
    if(isIdxList){
      if(cc==='000001'||cc==='000688') return `sh${cc}`;
      if(cc.startsWith('399')||cc==='899050') return `sz${cc}`;
    }
    return `${tencentPrefix(cc)}${cc}`;
  });
  const txt=await fetch(`https://qt.gtimg.cn/q=${qlist.join(',')}`).then(r=>r.text());
  const map={};
  txt.split(';').forEach(l=>{
    const m=l.match(/v_(.+?)="(.+?)"/); if(!m) return;
    const vs=m[2].split('~');
    // 兼容两种格式：
    // s_格式：3=price,4=change,5=pct%
    // 非s_格式：3=price,4=prev,5=open,33=high,34=low
    let price=parseFloat(vs[3]);
    let prev, change, pct;
    let open, high, low;
    if(vs[0]==='1' || vs[1]?.includes('指数') || m[1].startsWith('sh000001') || m[1].startsWith('sz399')){
      // 指数或非s_格式，vs[4]是prev
      prev=parseFloat(vs[4]);
      open=parseFloat(vs[5]);
      high=parseFloat(vs[33]);
      low=parseFloat(vs[34]);
      if(isNaN(prev)||prev<1) prev=price;
      change=price-prev;
      pct=prev? change/prev*100 : 0;
      // 如果vs[32]是合法的小百分比，用它
      const pct2=parseFloat(vs[32]);
      if(!isNaN(pct2) && Math.abs(pct2)<20) pct=pct2;
    }else{
      // s_格式
      change=parseFloat(vs[4]);
      pct=parseFloat(vs[5]);
      if(isNaN(pct)){
        const pctStr=vs[5];
        if(pctStr && pctStr.includes('%')) pct=parseFloat(pctStr);
      }
      prev=price-change;
      open=parseFloat(vs[5]); // s_格式open在后面？用vs[5]可能不对，用vs[?]，这里用price兜底
      if(isNaN(open)) open=prev||price;
      high=parseFloat(vs[33]);
      low=parseFloat(vs[34]);
      if(isNaN(pct)) pct=prev? change/prev*100:0;
    }
    if(isNaN(high)||high<=0) high=Math.max(price,open||price);
    if(isNaN(low)||low<=0) low=Math.min(price,open||price);
    // 钳制今日长K线
    if(high>price*1.11) high=Math.max(price,open||price);
    if(low<price*0.89) low=Math.min(price,open||price);
    if(!isNaN(price)) map[m[1]]={price,prev,pct,open,high,low,change:change||price-prev};
  });
  return map;
}

let idxTimer=null, watchTimer=null;
async function loadIdx(){
  document.getElementById('idx-time').textContent=new Date().toLocaleTimeString();
  const codes=['000001','399001','399006','000688','899050'];
  const map=await fetchQtBatch(codes, true);
  codes.forEach(code=>{
    let found=null;
    for(const k in map){ if(k.includes(code)){ found=map[k]; break; } }
    const pEl=document.getElementById('ip_'+code);
    const dEl=document.getElementById('id_'+code);
    const cEl=document.getElementById('ic_'+code);
    if(found&&pEl&&found.price>0){
      const up=found.change>=0;
      pEl.textContent=found.price.toFixed(2);
      pEl.className=up?'up':'down';
      dEl.textContent=(found.pct>0?'+':'')+found.pct.toFixed(2)+'%';
      dEl.className=up?'up':'down';
      cEl.textContent=`昨${found.prev.toFixed(2)}`;
    }else if(pEl){
      pEl.textContent='--';
    }
  });
}
async function loadWatch(){
  if(ensureWatch()) return;
  try{
    const map=await fetchQtBatch(watch, false);
    watch.forEach(code=>{
      let found=null;
      for(const k in map){ if(k.includes(code)){ found=map[k]; break; } }
      const pEl=document.getElementById('wp_'+code), cEl=document.getElementById('wc_'+code);
      if(found&&pEl){
        const up=found.change>=0;
        pEl.textContent=found.price.toFixed(2); pEl.className=up?'up':'down';
        cEl.textContent=(found.pct>0?'+':'')+found.pct.toFixed(2)+'%'; cEl.className=up?'up':'down';
      }
    });
  }catch{}
}
function startTimers(){
  if(idxTimer) clearInterval(idxTimer);
  if(watchTimer) clearInterval(watchTimer);
  loadIdx(); loadWatch();
  idxTimer=setInterval(loadIdx, 30000);
  watchTimer=setInterval(loadWatch, 8000); // 按之前的8秒，不改30秒
}
startTimers();
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ clearInterval(idxTimer); clearInterval(watchTimer); } else startTimers(); });

// K线：60根窗口，和别人版一样，轻度平滑，像通达信那样圆滑但数值准
async function getHistRaw(code, isIdx){
  const c=String(code).padStart(6,'0');
  const fileName=histFileName(c, isIdx);
  const urls=[
    `${RAW}/data/history/${fileName}?t=${Date.now()}`,
    `${RAW}/data/history/${c}.json?t=${Date.now()}`, // 兼容旧文件
    `${RAW}/data/history/sh_${c}.json?t=${Date.now()}`,
    `${RAW}/data/history/sz_${c}.json?t=${Date.now()}`,
  ];
  for(const url of urls){
    try{ const r=await fetch(url); if(r.ok){ const j=await r.json(); const arr=Array.isArray(j)?j:j; if(arr.length>=20) return arr; } }catch{}
  }
  return [];
}
async function getTencentKline(code, count, isIdx){
  try{
    const pref=isIdx? (code==='000001'||code==='000688'?'sh':'sz') : tencentPrefix(code);
    const param=`${pref}${String(code).padStart(6,'0')},day,,,${count},qfq`;
    const j=await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${param}`).then(r=>r.json());
    const key=`${pref}${String(code).padStart(6,'0')}`;
    const data=j.data?.[key];
    const klines=data?.qfqday || data?.day || [];
    if(!klines.length) return [];
    return klines.map(k=>({d:k[0], o:+k[1], c:+k[2], h:+k[3], l:+k[4], v:+k[5]*100}));
  }catch{ return []; }
}
async function getToday(code, isIdx){
  const map=await fetchQtBatch([code], isIdx);
  for(const k in map){ if(k.includes(code)) return map[k]; }
  return null;
}
async function getFullBars(code, isIdx){
  let hist=await getHistRaw(code, isIdx);
  if(!hist || hist.length<30){
    const tk=await getTencentKline(code, 90, isIdx);
    if(tk.length>20) hist=tk;
  }
  let bars=[...hist];
  const today=await getToday(code, isIdx);
  if(today){
    let o=today.open, h=today.high, l=today.low, c=today.price;
    if(isNaN(o)||o<=0) o=c;
    if(isNaN(h)||h<=0) h=Math.max(o,c);
    if(isNaN(l)||l<=0) l=Math.min(o,c);
    if(h>c*1.11) h=Math.max(o,c);
    if(l<c*0.89) l=Math.min(o,c);
    const todayBar={d:'今日实时', o, h, l, c, v:0};
    if(bars.length && bars[bars.length-1].d==='今日实时') bars[bars.length-1]=todayBar; else bars.push(todayBar);
  }
  const all=bars.slice(-60);
  return {bars:all, note:`${isIdx?'指数':'个股'}最近60根，60根计算，对齐通达信，平滑版`};
}
function compute_TDX_Smooth(bars){
  const n=bars.length;
  const cost50=new Array(n).fill(0), cost75=new Array(n).fill(0), cost90=new Array(n).fill(0);
  const zq=new Array(n).fill(0), zq1=new Array(n).fill(0);
  const vwma=new Array(n).fill(0);
  for(let i=0;i<n;i++){
    const start=Math.max(0,i-59);
    const slice=bars.slice(start,i+1);
    const totalVol=slice.reduce((s,b)=>s+b.v,0)||1;
    function winner(price){ let win=0; for(let b of slice) if(b.c<=price) win+=b.v; return win/totalVol*100; }
    let sumCV=0,sumV=0; for(let k=Math.max(0,i-9);k<=i;k++){sumCV+=bars[k].c*bars[k].v; sumV+=bars[k].v;}
    vwma[i]=sumV?sumCV/sumV:bars[i].c;
    zq[i]=winner(bars[i].c);
    zq1[i]=winner(vwma[i]);
    function costN(pct){
      const sorted=[...slice].sort((a,b)=>a.c-b.c);
      let cum=0;
      for(let b of sorted){ cum+=b.v; if(cum/totalVol*100>=pct) return b.c; }
      return sorted[sorted.length-1]?.c||bars[i].c;
    }
    cost50[i]=costN(50); cost75[i]=costN(75); cost90[i]=costN(90);
  }
  // 轻度EMA平滑，像别人版本那样平滑，但数值还是通达信的，不像之前那样锯齿
  function ema(arr, p=3){
    if(arr.length<=p) return arr;
    const res=[arr[0]]; const k=2/(p+1);
    for(let i=1;i<arr.length;i++) res[i]=arr[i]*k + res[i-1]*(1-k);
    return res;
  }
  return {cost50:ema(cost50,3), cost75:ema(cost75,3), cost90:ema(cost90,3), zq:ema(zq,3), zq1:ema(zq1,3), vwma};
}

function setup(c){ const dpr=window.devicePixelRatio||1; const w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr; const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); return {ctx,w,h}; }
let currentCode=null, currentIsIdx=false;
async function openDetail(code, isIdx){
  currentCode=code; currentIsIdx=isIdx;
  const detail=document.getElementById('detail');
  const mask=document.getElementById('loadingMask');
  detail.classList.add('open'); mask.style.display='flex';
  document.getElementById('dtitle').textContent=code+' · 加载中...';
  setup(document.getElementById('mainC')); setup(document.getElementById('subC'));
  document.getElementById('dinfo').textContent='加载中...';
  const {bars, note}=await getFullBars(code, isIdx);
  if(currentCode!==code) return;
  mask.style.display='none';
  if(!bars.length){ document.getElementById('dinfo').textContent='无数据'; return; }
  document.getElementById('dtitle').textContent=code+ (isIdx?' · 指数':' · 60根 平滑对齐通达信');
  let infoHtml=`<div>${note}</div><div>共${bars.length}根，最新 ${bars[bars.length-1].c.toFixed(2)} ${bars[bars.length-1].d==='今日实时'?'(今日实时已参与)':''}</div>`;
  if(!isIdx){
    const inds=compute_TDX_Smooth(bars);
    infoHtml+=`<div>COST50 ${inds.cost50[inds.cost50.length-1].toFixed(2)} COST75 ${inds.cost75[inds.cost75.length-1].toFixed(2)} COST90 ${inds.cost90[inds.cost90.length-1].toFixed(2)} <span style="color:#ff3b3b">←已含今日，平滑版</span></div><div>ZQ ${inds.zq[inds.zq.length-1].toFixed(1)} ZQ1 ${inds.zq1[inds.zq1.length-1].toFixed(1)} <span style="color:#ffcc00">←已含今日，平滑版</span></div>`;
    drawK(bars, inds, false);
  }else{
    infoHtml+=`<div style="color:#8a94a6">指数不计算COST/ZQ</div>`;
    drawK(bars, null, true);
  }
  document.getElementById('dinfo').innerHTML=infoHtml;
}
function drawK(bars, inds, isIdx){
  const mainC=document.getElementById('mainC'), subC=document.getElementById('subC');
  const {ctx,w,h}=setup(mainC); const {ctx:ctx2,w:w2,h:h2}=setup(subC);
  const min=Math.min(...bars.map(b=>b.l)), max=Math.max(...bars.map(b=>b.h)); const y=v=>h-10-(v-min)/(max-min||1)*(h-20);
  bars.forEach((b,i)=>{
    const x=i/(bars.length-1||1)*w; const up=b.c>=b.o; ctx.fillStyle=up?'#ff3b3b':'#00c873';
    ctx.fillRect(x-2.8, y(Math.max(b.o,b.c)), 5.6, Math.abs(y(b.o)-y(b.c))||2);
    ctx.fillRect(x-0.5, y(b.h), 1, y(b.l)-y(b.h));
    if(b.d==='今日实时'){ ctx.strokeStyle='#ff3b3b'; ctx.setLineDash([3,3]); ctx.strokeRect(x-6, y(b.h)-6, 12, y(b.l)-y(b.h)+12); ctx.setLineDash([]); }
  });
  if(!isIdx && inds){
    ctx.beginPath(); inds.cost50.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#2ecc71'; ctx.lineWidth=1.3; ctx.stroke();
    ctx.beginPath(); inds.cost75.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#ffcc00'; ctx.stroke();
    ctx.beginPath(); inds.cost90.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#ff4d4d'; ctx.stroke();
    const zy=v=>h2-10-v/100*(h2-20);
    ctx2.beginPath(); inds.zq.forEach((v,i)=>{const x=i/(bars.length-1||1)*w2; if(i===0) ctx2.moveTo(x,zy(v)); else ctx2.lineTo(x,zy(v));}); ctx2.strokeStyle='#ffcc00'; ctx2.stroke();
    ctx2.beginPath(); inds.zq1.forEach((v,i)=>{const x=i/(bars.length-1||1)*w2; if(i===0) ctx2.moveTo(x,zy(v)); else ctx2.lineTo(x,zy(v));}); ctx2.strokeStyle='#fff'; ctx2.stroke();
  }else{
    const ma=(p)=>{ const r=[]; for(let i=0;i<bars.length;i++){ let s=0,c=0; for(let k=Math.max(0,i-p+1);k<=i;k++){s+=bars[k].c;c++;} r.push(s/c);} return r; };
    const ma5=ma(5), ma10=ma(10);
    ctx.beginPath(); ma5.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#ffcc00'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ma10.forEach((v,i)=>{const x=i/(bars.length-1||1)*w; if(i===0) ctx.moveTo(x,y(v)); else ctx.lineTo(x,y(v));}); ctx.strokeStyle='#3a8bff'; ctx.stroke();
    const maxV=Math.max(...bars.map(b=>b.v)); const yv=v=>h2-5-v/maxV*(h2-10);
    bars.forEach((b,i)=>{ const x=i/(bars.length-1||1)*w2; const up=b.c>=b.o; ctx2.fillStyle=up?'#ff3b3b55':'#00c87355'; ctx2.fillRect(x-2.5,yv(b.v),5,h2-5-yv(b.v)); });
  }
}
document.getElementById('closeBtn').onclick=()=>{ currentCode=null; document.getElementById('detail').classList.remove('open'); };
