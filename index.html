<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.3 秒开版</title><style>body{margin:0;background:#0a0e14;color:#e8ecf2;font-family:system-ui}#app{max-width:430px;margin:0 auto}.card{margin:8px;border:1px solid #232f40;background:#141a24;border-radius:12px;overflow:hidden}.hd{padding:10px 12px;border-bottom:1px solid #232f40;font-weight:700;display:flex;justify-content:space-between}.row{padding:12px;border-bottom:1px solid #1a2332;display:flex;justify-content:space-between}.up{color:#ff3b3b}.down{color:#00c873}.hint{padding:20px;text-align:center;color:#8a94a6;font-size:12px}</style></head><body><div id="app">
<div class="card"><div class="hd"><span>指数 · 秒开</span><span id="t" style="font-size:10px;color:#8a94a6"></span></div><div id="idx"></div></div>
<div class="card"><div class="hd"><span>自选 · 满宽分时</span><span id="badge" style="font-size:10px;color:#fa5">检测中</span></div><div id="watch"></div><div style="padding:8px;display:flex;gap:8px"><input id="code" placeholder="600000" style="flex:1;background:#1c2532;border:1px solid #232f40;color:#fff;border-radius:8px;padding:8px"><button id="add" style="background:#3a8bff;color:#fff;border:0;border-radius:8px;padding:8px 14px">添加</button></div></div>
<div class="card"><div class="hint" id="log">正在连接...如果一直加载，说明GitHub Pages缓存旧文件，请强制刷新：手机Safari长按刷新选"请求桌面网站"或清缓存</div></div>
</div>
<script>
const REPO='itssteepturn-lgtm/stock-data-v5';
const RAW=`https://raw.githubusercontent.com/${REPO}/main`;
document.getElementById('t').textContent=new Date().toLocaleTimeString();
function secid(c){c=String(c).padStart(6,'0'); return c.startsWith('6')?'1.'+c:'0.'+c;}
let watch=JSON.parse(localStorage.getItem('v5_watch')||'["000001","399006","600519"]');
function renderSkeleton(){
  const idx=document.getElementById('idx');
  idx.innerHTML=['上证 000001','深证 399001','创业 399006','科创 000688','北证 899050'].map(n=>`<div class="row"><span>${n}</span><span id="p_${n.split(' ')[1]}">加载中...</span></div>`).join('');
  const w=document.getElementById('watch');
  w.innerHTML=watch.map(c=>`<div class="row"><span>${c}</span><span id="wp_${c}">加载分时...</span></div>`).join('');
}
renderSkeleton();
// 1. 先试自养
fetch(`${RAW}/data/meta.json?t=${Date.now()}`).then(r=>r.json()).then(m=>{
  document.getElementById('badge').textContent=`自养 ${m.updated?.slice(0,10)} ${m.count}支`;
  document.getElementById('badge').style.color='#7f7';
}).catch(()=>{
  document.getElementById('badge').textContent='自养暂无，走东财临时';
});
// 2. 指数用腾讯，秒开
async function loadIdx(){
  const list=[{name:'上证',code:'000001',qt:'s_sh000001'},{name:'深证',code:'399001',qt:'s_sz399001'},{name:'创业',code:'399006',qt:'s_sz399006'},{name:'科创',code:'000688',qt:'s_sh000688'},{name:'北证',code:'899050',qt:'s_bj899050'}];
  try{
    const url=`https://qt.gtimg.cn/q=${list.map(i=>i.qt).join(',')}`;
    const txt=await fetch(url).then(r=>r.text());
    const map={};
    txt.split(';').forEach(l=>{const m=l.match(/v_(.+?)="(.+?)"/); if(!m) return; const v=m[2].split('~'); map[m[1]]={price:parseFloat(v[3]),prev:parseFloat(v[4]),chg:parseFloat(v[32])};});
    list.forEach(i=>{
      const d=map[i.qt]; const el=document.getElementById(`p_${i.code}`);
      if(d&&el){const up=d.price>=d.prev; el.textContent=`${d.price.toFixed(2)} ${(d.chg>0?'+':'')+d.chg.toFixed(2)}%`; el.className=up?'up':'down';}
      else if(el) el.textContent='腾讯暂无';
    });
    document.getElementById('log').textContent='指数已用腾讯加载成功。如果还白屏，是GitHub Pages缓存了旧的index.html，请去仓库Settings-Pages点Save强制刷新。';
  }catch(e){
    document.getElementById('log').textContent='腾讯接口失败，尝试东财：'+e;
    for(const i of list){
      try{
        const j=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=${i.code.startsWith('6')||i.code=='000001'?'1.':'0.'}${i.code}&fields=f43,f60,f170`).then(r=>r.json());
        const price=j.data.f43, prev=j.data.f60, chg=(price-prev)/prev*100;
        const el=document.getElementById(`p_${i.code}`); if(el){el.textContent=`${(price/100).toFixed(2)} ${chg.toFixed(2)}%`; el.className=price>=prev?'up':'down';}
      }catch{}
    }
  }
}
async function loadWatch(){
  for(const code of watch){
    try{
      const sid=secid(code);
      const j=await fetch(`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${sid}&klt=1&fqt=1&lmt=10&fields2=f53`).then(r=>r.json());
      const kl=j?.data?.klines||[];
      const last=kl.length?parseFloat(kl[kl.length-1].split(',')[1]):0;
      const el=document.getElementById(`wp_${code}`);
      if(el) el.textContent=last?last.toFixed(2)+' 分时OK':'无分时';
    }catch{
      const el=document.getElementById(`wp_${code}`); if(el) el.textContent='加载失败';
    }
  }
}
loadIdx(); loadWatch();
document.getElementById('add').onclick=()=>{
  let c=document.getElementById('code').value.replace(/\D/g,'').padStart(6,'0');
  if(!/^\d{6}$/.test(c)) return alert('6位');
  watch=watch.filter(x=>x!==c); watch.unshift(c); localStorage.setItem('v5_watch',JSON.stringify(watch)); location.reload();
};
</script></body></html>
