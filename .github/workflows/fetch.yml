name: V5自养数据

on:
  schedule:
    - cron: '10 1 * * 1-5'   # 北京时间 9:10 自动养
    - cron: '10 7 * * 1-5'   # 北京时间 15:10 自动养
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build data
        run: python build_latest.py
      - name: Commit data
        run: |
          git config user.name "v5-bot"
          git config user.email "v5-bot@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: update data $(date +%F)"
          git push
