name: V5自养数据

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: '分片 0=前半 1=后半 2=全量'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install baostock pandas requests
      - name: Build
        env:
          SHARD: ${{ inputs.shard || '0' }}
          TOTAL_SHARDS: '2'
        run: |
          if [ "${{ inputs.shard }}" = "2" ]; then
            export TOTAL_SHARDS=1
            export SHARD=0
          fi
          python build_latest.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "V5.11 baostock shard ${{ inputs.shard || '0' }} $(date -u +%Y-%m-%d)"
          git push
