name: V5全功能版

on:
  schedule:
    # 北京 0:30,1:30,2:30,3:30,4:30,5:30,6:30,7:30,8:30,9:30 = UTC 16:30-01:30
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      clean:
        description: '全新跑(true) / 续跑(false)'
        required: false
        default: 'false'
      stock_codes:
        description: '指定代码逗号分隔，留空跑默认列表'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build
        env:
          CLEAN: ${{ inputs.clean }}
          STOCK_CODES: ${{ inputs.stock_codes }}
        run: python build_latest.py
      - name: Commit data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "data update $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
