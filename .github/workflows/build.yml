name: V5全功能版 - COST/ZQ历史+当日 全市场
on:
  schedule:
    - cron: '30 16 * * *'  # UTC 16:30 = 北京 0:30
    - cron: '30 17 * * *'  # 改为每半小时一次，原每小时200太慢
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'   # 8:30北京
    - cron: '30 1 * * *'   # 9:30北京 查缺补漏
  workflow_dispatch:
    inputs:
      clean:
        description: '是否清空data全新跑'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 允许跑6小时，一次跑完全市场
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install baostock pandas
      - name: Clean data if requested
        if: ${{ github.event.inputs.clean == 'true' }}
        run: rm -rf data
      - name: Ensure dirs
        run: mkdir -p data/stocks data/indices
      - name: Build V5 Full - COST/ZQ每时每刻 高效版
        run: python build_latest.py
      - name: Commit data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/
          git diff --staged --quiet || git commit -m "V5全功能 COST/ZQ历史+当日 $(date) 高效版 BATCH=500 指数个股分开"
          git push
