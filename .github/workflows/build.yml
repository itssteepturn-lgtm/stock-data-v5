name: V5全功能版 - COST/ZQ历史+当日 全市场
on:
  schedule:
    - cron: '30 16 * * *'  # UTC 16:30 = 北京 0:30
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      clean:
        description: '是否清空data全新跑'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install baostock pandas
      - name: Clean data if requested
        if: ${{ github.event.inputs.clean == 'true' }}
        run: rm -rf data
      - name: Ensure dirs
        run: mkdir -p data/stocks data/indices
      - name: Build V5 Full - COST/ZQ每时每刻
        run: python build_latest_v5_full.py
      - name: Commit data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/
          git diff --staged --quiet || git commit -m "V5全功能 COST/ZQ历史+当日 $(date) 指数个股分开 0:30每轮200只"
          git push
